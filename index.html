<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Lumen</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=DM+Sans:wght@400;500;600&display=swap">
<style>
:root{color-scheme:dark;--bg:#091210;--panel:#0f1b18;--panel2:#142520;--line:rgba(255,255,255,.08);--text:#eaf3ef;--muted:#86a198;--acc:#5eead4;--ease:cubic-bezier(.22,1,.36,1);
 box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
*{box-sizing:border-box;margin:0}
[hidden]{display:none!important}
html,body{height:100%}
body{background:var(--bg);color:var(--text);font:400 15px/1.5 "DM Sans",system-ui,sans-serif;overflow:hidden}
button,input,select{font:inherit;color:inherit}
button{background:none;border:0;cursor:pointer}
code{background:rgba(255,255,255,.08);padding:1px 6px;border-radius:5px}
:focus-visible{outline:2px solid var(--acc);outline-offset:2px}
svg.i{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round;flex:none}
h1{font:600 28px/1.1 "Space Grotesk",sans-serif;margin-bottom:6px}
.sub{color:var(--muted);margin-bottom:18px}
.noanim *,.noanim *:before,.noanim *:after{animation-duration:0s!important;transition-duration:0s!important;animation-delay:0s!important}
@media (prefers-reduced-motion:reduce){*,*:before,*:after{animation-duration:0s!important;transition-duration:0s!important}}

.app{display:grid;grid-template-columns:72px 1fr;height:100%}
.dock{display:flex;flex-direction:column;gap:4px;padding:14px 12px;background:var(--panel);border-right:1px solid var(--line);width:72px;transition:width .35s var(--ease);overflow:hidden;z-index:5;position:relative}
.dock:hover,.dock:focus-within{width:210px;box-shadow:12px 0 40px rgba(0,0,0,.4)}
.dock button{display:flex;align-items:center;gap:16px;height:44px;padding:0 12px;border-radius:12px;color:var(--muted);white-space:nowrap;transition:background .25s,color .25s,transform .2s var(--ease)}
.dock button span{opacity:0;transition:opacity .25s}
.dock:hover button span,.dock:focus-within button span{opacity:1}
.dock button:hover{background:rgba(255,255,255,.06);color:var(--text);transform:translateX(3px)}
.dock button.on{background:color-mix(in srgb,var(--acc) 16%,transparent);color:var(--acc)}
.dock .sp{flex:1}
.main{display:flex;flex-direction:column;min-width:0;min-height:0}
.strip{display:flex;align-items:flex-end;gap:4px;padding:10px 12px 0;overflow-x:auto;scrollbar-width:none;background:var(--bg)}
.tab{display:flex;align-items:center;gap:8px;max-width:190px;min-width:90px;height:38px;padding:0 10px 0 12px;border-radius:12px 12px 0 0;color:var(--muted);background:transparent;cursor:pointer;transition:background .3s,color .3s,max-width .35s var(--ease),opacity .3s;overflow:hidden;flex:none}
.tab.new{animation:tabin .4s var(--ease)}
.tab.out{max-width:0;min-width:0;padding:0;opacity:0}
.tab:hover{background:rgba(255,255,255,.05)}
.tab.on{background:var(--panel2);color:var(--text)}
.tab .t{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-size:14px}
.tab .x{width:22px;height:22px;display:grid;place-items:center;border-radius:6px;opacity:.6;transition:.2s}
.tab .x:hover{background:rgba(255,255,255,.12);opacity:1;transform:rotate(90deg)}
.plus{width:34px;height:34px;display:grid;place-items:center;border-radius:10px;color:var(--muted);margin-bottom:2px;flex:none;transition:.3s var(--ease)}
.plus:hover{background:rgba(255,255,255,.08);color:var(--text);transform:rotate(90deg)}
.bar{display:flex;align-items:center;gap:6px;padding:8px 12px;background:var(--panel2)}
.bar>button{width:34px;height:34px;display:grid;place-items:center;border-radius:10px;color:var(--muted);transition:.25s}
.bar>button:hover{background:rgba(255,255,255,.08);color:var(--text)}
.bar>button:active{transform:scale(.88)}
#reload:active svg{transform:rotate(360deg);transition:transform .5s var(--ease)}
.addr{flex:1;display:flex;min-width:0}
.addr input{flex:1;min-width:0;height:36px;background:var(--bg);border:1px solid var(--line);border-radius:12px;padding:0 14px;outline:0;transition:border-color .25s,box-shadow .3s}
.addr input:focus{border-color:var(--acc);box-shadow:0 0 0 4px color-mix(in srgb,var(--acc) 18%,transparent)}
.coins{display:flex;align-items:center;gap:6px;padding:0 12px;height:34px;border-radius:10px;background:rgba(251,191,36,.12);color:#fbbf24;font-weight:600;white-space:nowrap;transition:transform .3s var(--ease)}
.coins.pop{transform:scale(1.18)}
.stage{position:relative;flex:1;min-height:0;overflow:hidden;background:var(--panel2)}
#view,#webs>*{position:absolute;inset:0}
.pane{height:100%;overflow-y:auto;padding:28px clamp(16px,4vw,48px) 40px;position:relative}
.enter{animation:enter .5s var(--ease)}
.glow{position:absolute;inset:0;pointer-events:none;background:radial-gradient(60% 50% at 20% 0%,color-mix(in srgb,var(--acc) 18%,transparent),transparent 70%),radial-gradient(50% 40% at 100% 100%,rgba(251,191,36,.1),transparent 70%);animation:breathe 9s ease-in-out infinite alternate}
@keyframes enter{from{opacity:0;transform:translateY(14px) scale(.99)}}
@keyframes tabin{from{max-width:0;opacity:0}}
@keyframes rise{from{opacity:0;transform:translateY(22px)}}
@keyframes breathe{to{opacity:.55;transform:scale(1.06)}}
@keyframes pop{from{opacity:0;transform:scale(.92) translateY(6px)}}

.home{max-width:880px;margin:0 auto;text-align:center;padding-top:3vh;position:relative}
.hello{color:var(--muted)}
.clock{font:500 clamp(54px,9vw,92px)/1 "Space Grotesk",sans-serif;letter-spacing:-.03em;margin:4px 0 2px}
.mark{font:700 18px "Space Grotesk",sans-serif;letter-spacing:.3em;color:var(--acc);margin-bottom:22px}
.search{display:flex;align-items:center;gap:12px;max-width:560px;margin:0 auto 20px;height:54px;padding:0 20px;border-radius:27px;background:rgba(0,0,0,.35);border:1px solid var(--line);transition:.35s var(--ease)}
.search:focus-within{border-color:var(--acc);box-shadow:0 8px 40px color-mix(in srgb,var(--acc) 25%,transparent);transform:translateY(-2px)}
.search input{flex:1;background:none;border:0;outline:0;font-size:16px;min-width:0}
.quick{display:flex;flex-wrap:wrap;justify-content:center;gap:14px;margin-bottom:30px}
.q{width:76px;display:flex;flex-direction:column;align-items:center;gap:6px;font-size:12px;color:var(--muted);transition:.3s var(--ease)}
.q b{width:52px;height:52px;border-radius:16px;display:grid;place-items:center;font:600 20px "Space Grotesk";color:#07110f;transition:.3s var(--ease)}
.q:hover{transform:translateY(-4px);color:var(--text)}.q:hover b{border-radius:22px}
.bento{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:12px;text-align:left}
.bento>*{animation:rise .6s var(--ease) both;animation-delay:calc(var(--i)*60ms)}
.card{background:rgba(0,0,0,.28);border:1px solid var(--line);border-radius:18px;padding:18px;transition:transform .35s var(--ease),border-color .3s,background .3s}
button.card{display:block;text-align:left;width:100%}
button.card:hover{transform:translateY(-5px);border-color:var(--acc);background:rgba(0,0,0,.4)}
.card svg{color:var(--acc);margin-bottom:12px;width:24px;height:24px;transition:transform .4s var(--ease)}
button.card:hover svg{transform:scale(1.2) rotate(-6deg)}
.card h3{font:600 17px "Space Grotesk"}
.card p{color:var(--muted);font-size:13px}

.seg{display:inline-flex;gap:4px;padding:4px;border-radius:14px;background:rgba(0,0,0,.3);margin-bottom:18px;flex-wrap:wrap}
.seg button{padding:7px 16px;border-radius:10px;color:var(--muted);transition:.3s var(--ease)}
.seg button.on{background:var(--acc);color:#07110f;font-weight:600}
.seg button:not(.on):hover{color:var(--text);background:rgba(255,255,255,.06)}
.btn{display:inline-flex;align-items:center;gap:8px;padding:9px 18px;border-radius:12px;background:var(--acc);color:#07110f;font-weight:600;text-decoration:none;transition:.25s var(--ease)}
.btn:hover{transform:translateY(-2px);filter:brightness(1.1)}.btn:active{transform:scale(.95)}
.btn.ghost{background:rgba(255,255,255,.08);color:var(--text)}
.btn[disabled]{opacity:.4;pointer-events:none}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin-bottom:12px}
.in{background:rgba(0,0,0,.35);border:1px solid var(--line);border-radius:12px;padding:9px 14px;outline:0;transition:.25s;min-width:0}
.in:focus{border-color:var(--acc)}
.list{display:flex;flex-direction:column;gap:8px}
.item{display:flex;align-items:center;gap:12px;padding:12px 14px;border-radius:14px;background:rgba(0,0,0,.28);border:1px solid var(--line);animation:pop .35s var(--ease);transition:.3s}
.item:hover{border-color:rgba(255,255,255,.2)}
.item .g{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis}
.item.done .g{text-decoration:line-through;color:var(--muted)}
.chk{width:22px;height:22px;border-radius:7px;border:2px solid var(--muted);display:grid;place-items:center;transition:.3s var(--ease)}
.done .chk{background:var(--acc);border-color:var(--acc);color:#07110f}
.ic{color:var(--muted);transition:.2s}.ic:hover{color:#fb7185;transform:scale(1.2)}
.empty{color:var(--muted);padding:24px;text-align:center;border:1px dashed var(--line);border-radius:14px}

canvas{max-width:100%;border-radius:16px;background:rgba(0,0,0,.4);border:1px solid var(--line)}
.stat{display:flex;gap:20px;margin-bottom:10px;color:var(--muted)}.stat b{color:var(--text)}
.pad{display:grid;grid-template-columns:repeat(3,52px);gap:6px;margin-top:12px}
.pad button{height:46px;border-radius:12px;background:rgba(255,255,255,.08);transition:.2s}.pad button:active{transform:scale(.9);background:var(--acc);color:#07110f}
.mem{display:grid;grid-template-columns:repeat(4,76px);gap:10px;perspective:700px}
.mc{height:76px;position:relative;transform-style:preserve-3d;transition:transform .5s var(--ease)}
.mc.f{transform:rotateY(180deg)}
.mc>*{position:absolute;inset:0;display:grid;place-items:center;border-radius:16px;backface-visibility:hidden;font-size:30px}
.mc .b{background:var(--panel);border:1px solid var(--line)}.mc:hover .b{border-color:var(--acc)}
.mc .fr{background:color-mix(in srgb,var(--acc) 22%,var(--panel));transform:rotateY(180deg)}
.mc.ok .fr{background:var(--acc);animation:pop .4s}
.ttt{display:grid;grid-template-columns:repeat(3,90px);gap:8px}
.ttt button{height:90px;border-radius:16px;background:rgba(0,0,0,.35);border:1px solid var(--line);font:600 38px "Space Grotesk";transition:.25s var(--ease)}
.ttt button:not(:disabled):hover{background:rgba(255,255,255,.08);transform:scale(1.05)}
.ttt button span{display:inline-block;animation:pop .3s var(--ease)}
.viz{width:100%;height:120px;margin-bottom:16px}
.moods{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px;margin-bottom:16px}
.moods .card.on{border-color:var(--acc);background:color-mix(in srgb,var(--acc) 14%,transparent)}
.chat{display:flex;flex-direction:column;height:calc(100% - 90px);min-height:300px}
.msgs{flex:1;overflow-y:auto;display:flex;flex-direction:column;gap:10px;padding:4px 2px 12px}
.m{max-width:80%;padding:10px 14px;border-radius:16px;background:rgba(0,0,0,.35);animation:pop .35s var(--ease);white-space:pre-wrap;overflow-wrap:anywhere}
.m.me{align-self:flex-end;background:color-mix(in srgb,var(--acc) 25%,transparent)}
.m small{display:block;color:var(--muted);font-size:11px}
.term{background:#050a09;border:1px solid var(--line);border-radius:16px;padding:16px;font:14px/1.5 ui-monospace,Menlo,Consolas,monospace;height:min(480px,60vh);overflow-y:auto;cursor:text}
.term .o{white-space:pre-wrap;overflow-wrap:anywhere}
.term .ln{display:flex;gap:8px}.term .ln span{color:var(--acc)}
.term input{flex:1;background:none;border:0;outline:0;font:inherit;min-width:0}
.swatches{display:flex;gap:12px;flex-wrap:wrap}
.sw{width:100px;padding:12px;border-radius:16px;border:1px solid var(--line);background:rgba(0,0,0,.28);text-align:center;transition:.3s var(--ease)}
.sw:hover{transform:translateY(-4px)}.sw.on{border-color:var(--acc)}
.sw i{display:block;width:100%;height:36px;border-radius:10px;margin-bottom:8px}
.sw small{display:block;color:var(--muted)}
.tog{width:46px;height:26px;border-radius:13px;background:rgba(255,255,255,.15);position:relative;transition:.3s}
.tog:after{content:"";position:absolute;top:3px;left:3px;width:20px;height:20px;border-radius:50%;background:#fff;transition:.3s var(--ease)}
.tog.on{background:var(--acc)}.tog.on:after{transform:translateX(20px)}
.web{display:flex;flex-direction:column;background:#fff}
.wbar{display:flex;gap:12px;align-items:center;padding:8px 14px;background:var(--panel);color:var(--muted);font-size:13px}
.wbar .u{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.wbar a{color:var(--acc);text-decoration:none;white-space:nowrap}
.wbar .n{animation:pop .4s;display:none}.wbar .n.show{display:inline}
.web iframe{flex:1;border:0;width:100%;background:#fff}
.web .ld{height:2px;background:var(--acc);width:0;animation:load 3s var(--ease) forwards}
@keyframes load{to{width:92%}}
.toast{position:fixed;left:50%;bottom:calc(24px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--text);color:#07110f;padding:10px 18px;border-radius:14px;font-weight:500;animation:pop .35s var(--ease);z-index:50}
@media(max-width:700px){
 .app{grid-template-columns:1fr;grid-template-rows:1fr auto}
 .dock{order:2;flex-direction:row;width:100%!important;overflow-x:auto;border-right:0;border-top:1px solid var(--line);padding:6px;box-shadow:none!important}
 .dock .sp{display:none}.dock button span{display:none}.dock button{padding:0 14px;flex:none}
 .main{order:1}
}
</style>
</head>
<body>
<div class="app">
  <nav class="dock" id="dock" aria-label="Sections"></nav>
  <div class="main">
    <div class="strip" id="strip"></div>
    <div class="bar">
      <button id="back" aria-label="Back"><svg class="i" viewBox="0 0 24 24"><path d="M19 12H5M11 6l-6 6 6 6"/></svg></button>
      <button id="fwd" aria-label="Forward"><svg class="i" viewBox="0 0 24 24"><path d="M5 12h14M13 6l6 6-6 6"/></svg></button>
      <button id="reload" aria-label="Reload"><svg class="i" viewBox="0 0 24 24"><path d="M20 12a8 8 0 1 1-2.500-5.800M20 4v5h-5"/></svg></button>
      <form class="addr" id="af"><input id="addr" placeholder="Search or type a website" aria-label="Address" autocomplete="off"></form>
      <div class="coins" id="coins" title="Coins earned in games"></div>
    </div>
    <div class="stage"><div id="view"></div><div id="webs"></div></div>
  </div>
</div>
<script>
const P={home:'<path d="M3 11l9-8 9 8M5 10v10h14V10"/>',games:'<rect x="2" y="7" width="20" height="11" rx="4"/><path d="M7 10v5M4.500 12.500h5M16 11h.01M18 14h.01"/>',music:'<path d="M9 18V5l11-2v13"/><circle cx="6.500" cy="18" r="2.500"/><circle cx="17.500" cy="16" r="2.500"/>',film:'<rect x="3" y="4" width="18" height="16" rx="2"/><path d="M7 4v16M17 4v16M3 9h4M3 15h4M17 9h4M17 15h4"/>',ai:'<path d="M12 3l1.800 5.200L19 10l-5.200 1.800L12 17l-1.800-5.200L5 10l5.200-1.800zM19 16l.8 2.200L22 19l-2.200.8L19 22l-.8-2.200L16 19l2.200-.8z"/>',chat:'<path d="M21 12a8 8 0 0 1-11.800 7L3 21l2-5.500A8 8 0 1 1 21 12z"/>',vm:'<rect x="3" y="4" width="18" height="16" rx="2"/><path d="M7 10l3 2-3 2M13 15h4"/>',link:'<path d="M10 14a4 4 0 0 0 5.700 0l3-3a4 4 0 0 0-5.700-5.700l-1 1M14 10a4 4 0 0 0-5.700 0l-3 3A4 4 0 0 0 11 18.700l1-1"/>',shop:'<path d="M4 9l1.500-5h13L20 9M4 9v11h16V9M4 9c0 2 3 2 4 0 1 2 4 2 4 0 1 2 4 2 4 0 1 2 4 2 4 0"/>',user:'<circle cx="12" cy="8" r="4"/><path d="M4 21c1-4 4-6 8-6s7 2 8 6"/>',gear:'<circle cx="12" cy="12" r="3"/><path d="M12 2v3M12 19v3M2 12h3M19 12h3M5 5l2 2M17 17l2 2M19 5l-2 2M7 17l-2 2"/>',x:'<path d="M6 6l12 12M18 6L6 18"/>',plus:'<path d="M12 5v14M5 12h14"/>',search:'<circle cx="11" cy="11" r="7"/><path d="M20 20l-4-4"/>',check:'<path d="M5 12l5 5 9-10"/>',trash:'<path d="M4 7h16M9 7V4h6v3M6 7l1 13h10l1-13"/>',send:'<path d="M4 12l16-8-6 16-3-7z"/>',globe:'<circle cx="12" cy="12" r="9"/><path d="M3 12h18M12 3c3 3 3 15 0 18M12 3c-3 3-3 15 0 18"/>'};
const ic=n=>`<svg class="i" viewBox="0 0 24 24">${P[n]}</svg>`;
const $=(s,r=document)=>r.querySelector(s),$$=(s,r=document)=>[...r.querySelectorAll(s)];
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const cap=async n=>{try{return window.claude?await window.claude.use(n):null}catch(e){return null}};

let S={name:'guest',coins:0,acc:'#5eead4',own:['#5eead4'],anim:true,h24:false,watch:[],links:[],hs:{snake:0,mem:0}};
try{Object.assign(S,JSON.parse(localStorage.getItem('lumen')||'{}'))}catch(e){}
const save=()=>{try{localStorage.setItem('lumen',JSON.stringify(S))}catch(e){}};
function applyTheme(){document.documentElement.style.setProperty('--acc',S.acc);document.body.classList.toggle('noanim',!S.anim);$('#coins').innerHTML=`${ic('shop').replace('class="i"','class="i" style="width:16px;height:16px"')}<b>${S.coins}</b>`}
function earn(n){if(n<=0)return;S.coins+=n;save();applyTheme();const c=$('#coins');c.classList.add('pop');setTimeout(()=>c.classList.remove('pop'),300);toast('+'+n+' coins')}
function toast(t){const e=document.createElement('div');e.className='toast';e.textContent=t;document.body.appendChild(e);setTimeout(()=>{e.style.transition='opacity .3s';e.style.opacity=0;setTimeout(()=>e.remove(),300)},1600)}

/* ---------- sections registry ---------- */
const SEC={
 games:{n:'Games',i:'games',d:'Snake, memory and tic-tac-toe. Earn coins.',f:secGames},
 music:{n:'Music',i:'music',d:'Generative ambient sound you can leave running.',f:secMusic},
 movies:{n:'Movies',i:'film',d:'Your watchlist, plus quick lookup.',f:secMovies},
 vms:{n:'Sandbox',i:'vm',d:'A small command line that runs in the page.',f:secVMs},
 linkgen:{n:'Linkgen',i:'link',d:'Save links as shortcuts on your home page.',f:secLinkgen},
 shop:{n:'Shop',i:'shop',d:'Spend coins on accent colors.',f:secShop},
 account:{n:'Account',i:'user',d:'Your name, stats and progress.',f:secAccount},
 settings:{n:'Settings',i:'gear',d:'Animations, clock and colors.',f:secSettings}};

/* ---------- tabs & navigation ---------- */
let tabs=[{id:1,k:'home',t:'Home'}],cur=1,nid=2,hist=[1],hi=0,cleanup=null,fresh=null;
function tIcon(t){return t.k==='home'?ic('home'):t.k==='sec'?ic(SEC[t.key].i):ic('globe')}
function renderStrip(){
  $('#strip').innerHTML=tabs.map(t=>`<div class="tab ${t.id===cur?'on':''} ${t.id===fresh?'new':''}" data-id="${t.id}" role="button" tabindex="0">${tIcon(t)}<span class="t">${esc(t.t)}</span><button class="x" data-x="${t.id}" aria-label="Close tab">${ic('x').replace('class="i"','class="i" style="width:14px;height:14px"')}</button></div>`).join('')+`<button class="plus" id="np" aria-label="New tab">${ic('plus')}</button>`;
  fresh=null;$('#dock').querySelectorAll('button[data-s]').forEach(b=>{const t=tabs.find(x=>x.id===cur);b.classList.toggle('on',!!t&&((t.k==='home'&&b.dataset.s==='home')||(t.k==='sec'&&t.key===b.dataset.s)))});
}
function renderDock(){
  const it=[['home','Home','home'],...Object.entries(SEC).filter(([k])=>k!=='settings').map(([k,v])=>[k,v.n,v.i])];
  $('#dock').innerHTML=it.map(([k,n,i])=>`<button data-s="${k}" aria-label="${n}">${ic(i)}<span>${n}</span></button>`).join('')+'<div class="sp"></div>'+`<button data-s="settings" aria-label="Settings">${ic('gear')}<span>Settings</span></button>`;
}
function select(id,push=true){cur=id;if(push){hist=hist.slice(0,hi+1);hist.push(id);hi=hist.length-1}show()}
function addTab(t){t.id=nid++;tabs.push(t);fresh=t.id;select(t.id)}
function openSec(k){if(k==='home'){const h=tabs.find(t=>t.k==='home');return h?select(h.id):addTab({k:'home',t:'Home'})}const e=tabs.find(t=>t.k==='sec'&&t.key===k);e?select(e.id):addTab({k:'sec',key:k,t:SEC[k].n})}
function closeTab(id){
  const el=$(`.tab[data-id="${id}"]`);
  const fin=()=>{const i=tabs.findIndex(t=>t.id===id);if(i<0)return;const t=tabs[i];if(t.node)t.node.remove();tabs.splice(i,1);
    if(!tabs.length)tabs.push({id:nid++,k:'home',t:'Home'});
    hist=hist.filter(x=>x!==id);if(cur===id){cur=tabs[Math.max(0,i-1)].id;hist.push(cur)}hi=Math.min(hi,hist.length-1);show()};

}
function go(raw){
  const v=raw.trim();if(!v)return;

}

function gSnake(b){
  b.innerHTML=`<div class="stat"><span>Score <b id="sc">0</b></span><span>Best <b id="bs">${S.hs.snake}</b></span></div><canvas id="cv" width="360" height="360"></canvas><div class="row" style="margin-top:12px"><button class="btn" id="go">Start</button><span class="sub" style="margin:0">Arrows or WASD</span></div><div class="pad"><i></i><button data-d="0,-1" aria-label="Up">▲</button><i></i><button data-d="-1,0" aria-label="Left">◀</button><button data-d="0,1" aria-label="Down">▼</button><button data-d="1,0" aria-label="Right">▶</button></div>`;
  const c=$('#cv',b).getContext('2d'),N=18,Z=20;let sn,dir,nd,food,sc,t=null,dead=false;
  const pl=()=>{let f;do f={x:Math.random()*N|0,y:Math.random()*N|0};while(sn.some(s=>s.x===f.x&&s.y===f.y));return f};
  function draw(){c.clearRect(0,0,360,360);c.fillStyle='rgba(255,255,255,.04)';for(let i=0;i<N;i++)for(let j=0;j<N;j++)if((i+j)%2)c.fillRect(i*Z,j*Z,Z,Z);
    c.fillStyle='#fbbf24';c.beginPath();c.arc(food.x*Z+10,food.y*Z+10,7,0,7);c.fill();
    sn.forEach((s,i)=>{c.globalAlpha=1-i/(sn.length+8);c.fillStyle=S.acc;c.beginPath();c.roundRect(s.x*Z+1,s.y*Z+1,Z-2,Z-2,6);c.fill()});c.globalAlpha=1;
    if(dead){c.fillStyle='rgba(0,0,0,.6)';c.fillRect(0,0,360,360);c.fillStyle='#fff';c.font='600 26px "Space Grotesk"';c.textAlign='center';c.fillText('Game over',180,185)}}
  function reset(){sn=[{x:9,y:9},{x:8,y:9},{x:7,y:9}];dir=nd={x:1,y:0};sc=0;dead=false;food=pl();$('#sc',b).textContent=0;draw()}
  function step(){const h={x:sn[0].x+nd.x,y:sn[0].y+nd.y};dir=nd;
    if(h.x<0||h.y<0||h.x>=N||h.y>=N||sn.some(s=>s.x===h.x&&s.y===h.y)){clearInterval(t);t=null;dead=true;if(sc>S.hs.snake){S.hs.snake=sc;$('#bs',b).textContent=sc}earn(sc);save();$('#go',b).textContent='Play again';return draw()}
    sn.unshift(h);if(h.x===food.x&&h.y===food.y){sc++;$('#sc',b).textContent=sc;food=pl()}else sn.pop();draw()}
  const turn=(x,y)=>{if(x!==-dir.x||y!==-dir.y)nd={x,y}};
  const kd=e=>{const m={ArrowUp:[0,-1],w:[0,-1],ArrowDown:[0,1],s:[0,1],ArrowLeft:[-1,0],a:[-1,0],ArrowRight:[1,0],d:[1,0]}[e.key];if(m&&t){e.preventDefault();turn(...m)}};
  document.addEventListener('keydown',kd);
  $('#go',b).onclick=()=>{clearInterval(t);reset();t=setInterval(step,115);$('#go',b).textContent='Restart'};
  $$('.pad button',b).forEach(p=>p.onclick=()=>turn(...p.dataset.d.split(',').map(Number)));
  reset();return()=>{clearInterval(t);document.removeEventListener('keydown',kd)};
}
function gMem(b){
  const em=['🌙','🔥','🌊','🍀','⭐','🎲','🪐','🍉'],d=[...em,...em].sort(()=>Math.random()-.5);let open=[],moves=0,lock=false,found=0;
  b.innerHTML=`<div class="stat"><span>Moves <b id="mv">0</b></span><span>Best <b>${S.hs.mem||'–'}</b></span></div><div class="mem">${d.map((e,i)=>`<button class="mc" data-i="${i}" aria-label="Card"><div class="b"></div><div class="fr">${e}</div></button>`).join('')}</div><div class="row" style="margin-top:14px"><button class="btn ghost" id="rs">New game</button></div>`;

    if(open.length===2){moves++;$('#mv',b).textContent=moves;const[a,z]=open;
      if(d[a.dataset.i]===d[z.dataset.i]){a.classList.add('ok');z.classList.add('ok');open=[];if(++found===8){const e=Math.max(2,14-moves);earn(e);if(!S.hs.mem||moves<S.hs.mem){S.hs.mem=moves;save()}}}

}
function gTtt(b){
  let bd=Array(9).fill(''),over=false;const L=[[0,1,2],[3,4,5],[6,7,8],[0,3,6],[1,4,7],[2,5,8],[0,4,8],[2,4,6]];
  const win=p=>L.some(l=>l.every(i=>bd[i]===p));
  const find=p=>{for(const l of L){const v=l.map(i=>bd[i]);if(v.filter(x=>x===p).length===2&&v.includes(''))return l[v.indexOf('')]}return -1};
  function ai(){let m=find('O');if(m<0)m=find('X');if(m<0&&!bd[4])m=4;if(m<0){const o=[0,2,6,8,1,3,5,7].filter(i=>!bd[i]);m=o[Math.random()*Math.min(o.length,3)|0]}bd[m]='O'}
  function draw(msg){b.innerHTML=`<p class="sub" id="tm">${msg||'You are X. Your move.'}</p><div class="ttt">${bd.map((v,i)=>`<button data-i="${i}" ${v||over?'disabled':''} aria-label="Cell ${i+1}"><span>${v}</span></button>`).join('')}</div><div class="row" style="margin-top:14px"><button class="btn ghost" id="rs">New game</button></div>`;
    $('#rs',b).onclick=()=>{bd=Array(9).fill('');over=false;draw()};
    $$('.ttt button',b).forEach(c=>c.onclick=()=>{bd[c.dataset.i]='X';
      if(win('X')){over=true;earn(3);return draw('You win!')}
      if(bd.every(x=>x)){over=true;earn(1);return draw('A draw.')}
      ai();if(win('O')){over=true;return draw('The computer wins this one.')}
      if(bd.every(x=>x)){over=true;earn(1);return draw('A draw.')}draw()})}
  draw();return()=>{};
}

/* ---------- music ---------- */
let AU=null;
const MOODS={calm:{n:'Calm',d:'Soft pentatonic bells',sc:[261.63,293.66,329.63,392,440,523.25,587.33],gap:1000,w:'sine'},night:{n:'Night',d:'Slow minor arpeggios',sc:[110,164.81,196,220,261.63,329.63],gap:1500,w:'triangle'},rain:{n:'Rain',d:'Filtered noise, no melody',noise:true}};
function au(){if(!AU){const ctx=new(window.AudioContext||window.webkitAudioContext)(),m=ctx.createGain(),an=ctx.createAnalyser();m.gain.value=.6;an.fftSize=64;m.connect(an);an.connect(ctx.destination);AU={ctx,m,an,mood:null,tm:null,nodes:[]}}return AU}
function stopMusic(){if(!AU)return;clearInterval(AU.tm);AU.nodes.forEach(n=>{try{n.stop()}catch(e){}});AU.nodes=[];AU.mood=null}
function playMood(k){stopMusic();const a=au();a.ctx.resume();a.mood=k;const m=MOODS[k];
  const note=(f,w)=>{const o=a.ctx.createOscillator(),g=a.ctx.createGain(),t=a.ctx.currentTime;o.type=w;o.frequency.value=f;g.gain.setValueAtTime(0,t);g.gain.linearRampToValueAtTime(.16,t+.05);g.gain.exponentialRampToValueAtTime(.001,t+3);o.connect(g);g.connect(a.m);o.start(t);o.stop(t+3.1)};
  if(m.noise){const buf=a.ctx.createBuffer(1,a.ctx.sampleRate*2,a.ctx.sampleRate),d=buf.getChannelData(0);for(let i=0;i<d.length;i++)d[i]=Math.random()*2-1;const s=a.ctx.createBufferSource(),f=a.ctx.createBiquadFilter(),g=a.ctx.createGain();s.buffer=buf;s.loop=true;f.type='bandpass';f.frequency.value=1400;f.Q.value=.5;g.gain.value=.35;s.connect(f);f.connect(g);g.connect(a.m);s.start();a.nodes.push(s)}
  else{const p=()=>note(m.sc[Math.random()*m.sc.length|0],m.w);p();a.tm=setInterval(()=>{p();if(Math.random()<.3)setTimeout(p,m.gap/2)},m.gap)}}
function secMusic(el){
  el.innerHTML=`<div class="glow"></div><div style="position:relative"><h1>Music</h1><p class="sub">Generated live in your browser, so it never ends.</p><canvas class="viz" id="vz" width="800" height="120"></canvas><div class="moods">${Object.entries(MOODS).map(([k,m])=>`<button class="card" data-m="${k}"><h3>${m.n}</h3><p>${m.d}</p></button>`).join('')}</div><div class="row"><button class="btn ghost" id="st">Stop</button><label class="row" style="margin:0">Volume <input type="range" id="vl" min="0" max="1" step=".05" value="${AU?AU.m.gain.value:.6}"></label></div><p class="sub" style="margin-top:12px">Want streaming? <button class="btn ghost" data-go="https://open.spotify.com">Open Spotify</button></p></div>`;

   open:a=>{if(!a)return'open: give a URL';go(a);return'Opening '+a},
   neofetch:()=>`${S.name}@lumen\n----------\nCoins: ${S.coins}\nTabs: ${tabs.length}\nBest snake: ${S.hs.snake}\nBrowser: ${navigator.userAgent.split(' ').pop()}`,
   clear:()=>{to.innerHTML='';return null}};
  ti.onkeydown=e=>{
    if(e.key==='Enter'){const v=ti.value;ti.value='';say('$ '+v);if(v.trim()){H.push(v);hp=H.length;const[c,...r]=v.trim().split(/\s+/);const f=C[c];const o=f?f(r.join(' ')):c+': command not found';if(o!==null)say(o)}}
    else if(e.key==='ArrowUp'&&hp>0){ti.value=H[--hp];e.preventDefault()}
    else if(e.key==='ArrowDown'){ti.value=H[++hp]||'';hp=Math.min(hp,H.length)}};
  tm.onclick=()=>ti.focus();
}

/* ---------- linkgen ---------- */
function secLinkgen(el){
  el.innerHTML=`<div class="glow"></div><div style="position:relative;max-width:640px"><h1>Linkgen</h1><p class="sub">Clean up a link and pin it to your home page.</p><form class="row" id="lf"><input class="in" id="ln" placeholder="Name" style="width:150px" aria-label="Name"><input class="in" id="lu" placeholder="example.com/page" style="flex:1" aria-label="URL"><button class="btn">Save</button></form><div class="list" id="ll"></div></div>`;
  const r=()=>{$('#ll',el).innerHTML=S.links.length?S.links.map((l,i)=>`<div class="item"><span class="g"><b>${esc(l.n)}</b> <span class="sub" style="margin:0">${esc(l.u)}</span></span><button class="btn ghost" data-o="${i}">Open</button><button class="btn ghost" data-c="${i}">Copy</button><button class="ic" data-d="${i}" aria-label="Remove">${ic('trash')}</button></div>`).join(''):'<div class="empty">No saved links yet. Saved links show up as shortcuts on Home.</div>'};r();
  $('#lf',el).onsubmit=e=>{e.preventDefault();let u=$('#lu',el).value.trim(),n=$('#ln',el).value.trim();if(!u)return;if(!/^https?:\/\//i.test(u))u='https://'+u;
    try{const U=new URL(u);['utm_source','utm_medium','utm_campaign','fbclid','gclid'].forEach(k=>U.searchParams.delete(k));u=U.href;if(!n)n=U.hostname.replace(/^www\./,'')}catch(x){return toast('That doesn’t look like a link')}
    S.links.push({n,u});save();$('#lu',el).value='';$('#ln',el).value='';r();toast('Saved')};
  $('#ll',el).onclick=e=>{const o=e.target.closest('[data-o]'),c=e.target.closest('[data-c]'),d=e.target.closest('[data-d]');
    if(o)go(S.links[o.dataset.o].u);
    if(c)navigator.clipboard.writeText(S.links[c.dataset.c].u).then(()=>toast('Copied'),()=>toast('Copy blocked by the browser'));
    if(d){S.links.splice(d.dataset.d,1);save();r()}};
}

/* ---------- shop / account / settings ---------- */
const COLORS=[['Aqua','#5eead4',0],['Amber','#fbbf24',10],['Coral','#fb7185',15],['Violet','#a78bfa',20],['Lime','#a3e635',25],['Sky','#38bdf8',30]];
function secShop(el){
  const r=()=>{el.innerHTML=`<div class="glow"></div><div style="position:relative"><h1>Shop</h1><p class="sub">You have <b>${S.coins}</b> coins. Earn more in Games.</p><div class="swatches">${COLORS.map(([n,c,p])=>{const own=S.own.includes(c);return `<button class="sw ${S.acc===c?'on':''}" data-c="${c}"><i style="background:${c}"></i>${n}<small>${S.acc===c?'In use':own?'Use':p+' coins'}</small></button>`}).join('')}</div></div>`};r();
  el.onclick=e=>{const b=e.target.closest('[data-c]');if(!b)return;const[,c,p]=COLORS.find(x=>x[1]===b.dataset.c);
    if(!S.own.includes(c)){if(S.coins<p)return toast('Need '+(p-S.coins)+' more coins');S.coins-=p;S.own.push(c);toast('Unlocked')}
    S.acc=c;save();applyTheme();r()};
}
function secAccount(el){
  const r=()=>{el.innerHTML=`<div class="glow"></div><div style="position:relative;max-width:560px"><h1>Account</h1><p class="sub">Everything is stored in this browser only.</p><form class="row" id="nf"><input class="in" id="nm" value="${esc(S.name)}" maxlength="20" aria-label="Display name" style="flex:1"><button class="btn">Save name</button></form><div class="bento" style="grid-template-columns:repeat(3,1fr)"><div class="card"><h3>${S.coins}</h3><p>Coins</p></div><div class="card"><h3>${S.hs.snake}</h3><p>Best snake</p></div><div class="card"><h3>${S.watch.filter(w=>w.d).length}/${S.watch.length}</h3><p>Movies watched</p></div></div><div class="row" style="margin-top:20px"><button class="btn ghost" id="rst">Reset all progress</button></div></div>`;
    $('#nf',el).onsubmit=e=>{e.preventDefault();S.name=$('#nm',el).value.trim()||'guest';save();toast('Saved')};
    $('#rst',el).onclick=()=>{if($('#rst',el).dataset.s){try{localStorage.removeItem('lumen')}catch(e){}location.reload()}else{$('#rst',el).textContent='Click again to confirm';$('#rst',el).dataset.s=1}}};r();
}
function secSettings(el){
  const r=()=>{const tg=(k,l)=>`<div class="item"><span class="g">${l}</span><button class="tog ${S[k]?'on':''}" data-k="${k}" role="switch" aria-checked="${!!S[k]}" aria-label="${l}"></button></div>`;
    el.innerHTML=`<div class="glow"></div><div style="position:relative;max-width:560px"><h1>Settings</h1><p class="sub">Changes apply right away.</p><div class="list">${tg('anim','Animations')}${tg('h24','24-hour clock')}</div><h3 style="margin:22px 0 10px;font:600 17px 'Space Grotesk'">Accent color</h3><div class="row">${S.own.map(c=>`<button class="sw ${S.acc===c?'on':''}" data-c="${c}" style="width:56px;padding:8px" aria-label="Accent ${c}"><i style="background:${c};margin:0"></i></button>`).join('')}</div><p class="sub">More colors are in the Shop.</p></div>`};r();
  el.onclick=e=>{const k=e.target.closest('[data-k]'),c=e.target.closest('[data-c]');if(k)S[k.dataset.k]=!S[k.dataset.k];if(c)S.acc=c.dataset.c;if(k||c){save();applyTheme();r()}};
}

renderDock();applyTheme();show();
</script>
