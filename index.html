<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Lumen</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=DM+Sans:wght@400;500;600&display=swap">
<style>
:root{color-scheme:dark;--bg:#091210;--panel:#0f1b18;--panel2:#142520;--line:rgba(255,255,255,.08);--text:#eaf3ef;--muted:#86a198;--acc:#5eead4;--ease:cubic-bezier(.22,1,.36,1);
 box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
*{box-sizing:border-box;margin:0}
[hidden]{display:none!important}
html,body{height:100%}
body{background:var(--bg);color:var(--text);font:400 15px/1.5 "DM Sans",system-ui,sans-serif;overflow:hidden}
button,input,select{font:inherit;color:inherit}
button{background:none;border:0;cursor:pointer}
code{background:rgba(255,255,255,.08);padding:1px 6px;border-radius:5px}
:focus-visible{outline:2px solid var(--acc);outline-offset:2px}
svg.i{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round;flex:none}
h1{font:600 28px/1.1 "Space Grotesk",sans-serif;margin-bottom:6px}
.sub{color:var(--muted);margin-bottom:18px}
.noanim *,.noanim *:before,.noanim *:after{animation-duration:0s!important;transition-duration:0s!important;animation-delay:0s!important}
@media (prefers-reduced-motion:reduce){*,*:before,*:after{animation-duration:0s!important;transition-duration:0s!important}}

.app{display:grid;grid-template-columns:72px 1fr;height:100%}
.dock{display:flex;flex-direction:column;gap:4px;padding:14px 12px;background:var(--panel);border-right:1px solid var(--line);width:72px;transition:width .35s var(--ease);overflow:hidden;z-index:5;position:relative}
.dock:hover,.dock:focus-within{width:210px;box-shadow:12px 0 40px rgba(0,0,0,.4)}
.dock button{display:flex;align-items:center;gap:16px;height:44px;padding:0 12px;border-radius:12px;color:var(--muted);white-space:nowrap;transition:background .25s,color .25s,transform .2s var(--ease)}
.dock button span{opacity:0;transition:opacity .25s}
.dock:hover button span,.dock:focus-within button span{opacity:1}
.dock button:hover{background:rgba(255,255,255,.06);color:var(--text);transform:translateX(3px)}
.dock button.on{background:color-mix(in srgb,var(--acc) 16%,transparent);color:var(--acc)}
.dock .sp{flex:1}
.main{display:flex;flex-direction:column;min-width:0;min-height:0}
.strip{display:flex;align-items:flex-end;gap:4px;padding:10px 12px 0;overflow-x:auto;scrollbar-width:none;background:var(--bg)}
.tab{display:flex;align-items:center;gap:8px;max-width:190px;min-width:90px;height:38px;padding:0 10px 0 12px;border-radius:12px 12px 0 0;color:var(--muted);background:transparent;cursor:pointer;transition:background .3s,color .3s,max-width .35s var(--ease),opacity .3s;overflow:hidden;flex:none}
.tab.new{animation:tabin .4s var(--ease)}
.tab.out{max-width:0;min-width:0;padding:0;opacity:0}
.tab:hover{background:rgba(255,255,255,.05)}
.tab.on{background:var(--panel2);color:var(--text)}
.tab .t{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-size:14px}
.tab .x{width:22px;height:22px;display:grid;place-items:center;border-radius:6px;opacity:.6;transition:.2s}
.tab .x:hover{background:rgba(255,255,255,.12);opacity:1;transform:rotate(90deg)}
.plus{width:34px;height:34px;display:grid;place-items:center;border-radius:10px;color:var(--muted);margin-bottom:2px;flex:none;transition:.3s var(--ease)}
.plus:hover{background:rgba(255,255,255,.08);color:var(--text);transform:rotate(90deg)}
.bar{display:flex;align-items:center;gap:6px;padding:8px 12px;background:var(--panel2)}
.bar>button{width:34px;height:34px;display:grid;place-items:center;border-radius:10px;color:var(--muted);transition:.25s}
.bar>button:hover{background:rgba(255,255,255,.08);color:var(--text)}
.bar>button:active{transform:scale(.88)}
#reload:active svg{transform:rotate(360deg);transition:transform .5s var(--ease)}
.addr{flex:1;display:flex;min-width:0}
.addr input{flex:1;min-width:0;height:36px;background:var(--bg);border:1px solid var(--line);border-radius:12px;padding:0 14px;outline:0;transition:border-color .25s,box-shadow .3s}
.addr input:focus{border-color:var(--acc);box-shadow:0 0 0 4px color-mix(in srgb,var(--acc) 18%,transparent)}
.coins{display:flex;align-items:center;gap:6px;padding:0 12px;height:34px;border-radius:10px;background:rgba(251,191,36,.12);color:#fbbf24;font-weight:600;white-space:nowrap;transition:transform .3s var(--ease)}
.coins.pop{transform:scale(1.18)}
.stage{position:relative;flex:1;min-height:0;overflow:hidden;background:var(--panel2)}
#view,#webs>*{position:absolute;inset:0}
.pane{height:100%;overflow-y:auto;padding:28px clamp(16px,4vw,48px) 40px;position:relative}
.enter{animation:enter .5s var(--ease)}
.glow{position:absolute;inset:0;pointer-events:none;background:radial-gradient(60% 50% at 20% 0%,color-mix(in srgb,var(--acc) 18%,transparent),transparent 70%),radial-gradient(50% 40% at 100% 100%,rgba(251,191,36,.1),transparent 70%);animation:breathe 9s ease-in-out infinite alternate}
@keyframes enter{from{opacity:0;transform:translateY(14px) scale(.99)}}
@keyframes tabin{from{max-width:0;opacity:0}}
@keyframes rise{from{opacity:0;transform:translateY(22px)}}
@keyframes breathe{to{opacity:.55;transform:scale(1.06)}}
@keyframes pop{from{opacity:0;transform:scale(.92) translateY(6px)}}

.home{max-width:880px;margin:0 auto;text-align:center;padding-top:3vh;position:relative}
.hello{color:var(--muted)}
.clock{font:500 clamp(54px,9vw,92px)/1 "Space Grotesk",sans-serif;letter-spacing:-.03em;margin:4px 0 2px}
.mark{font:700 18px "Space Grotesk",sans-serif;letter-spacing:.3em;color:var(--acc);margin-bottom:22px}
.search{display:flex;align-items:center;gap:12px;max-width:560px;margin:0 auto 20px;height:54px;padding:0 20px;border-radius:27px;background:rgba(0,0,0,.35);border:1px solid var(--line);transition:.35s var(--ease)}
.search:focus-within{border-color:var(--acc);box-shadow:0 8px 40px color-mix(in srgb,var(--acc) 25%,transparent);transform:translateY(-2px)}
.search input{flex:1;background:none;border:0;outline:0;font-size:16px;min-width:0}
.quick{display:flex;flex-wrap:wrap;justify-content:center;gap:14px;margin-bottom:30px}
.q{width:76px;display:flex;flex-direction:column;align-items:center;gap:6px;font-size:12px;color:var(--muted);transition:.3s var(--ease)}
.q b{position:relative;overflow:hidden;width:52px;height:52px;border-radius:16px;display:grid;place-items:center;font:600 20px "Space Grotesk";color:#07110f;transition:.3s var(--ease)}
.q:hover{transform:translateY(-4px);color:var(--text)}
.q b img{position:absolute;inset:0;width:100%;height:100%;object-fit:contain;background:#fff;padding:7px}.q:hover b{border-radius:22px}
.bento{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:12px;text-align:left}
.bento>*{animation:rise .6s var(--ease) both;animation-delay:calc(var(--i)*60ms)}
.card{background:rgba(0,0,0,.28);border:1px solid var(--line);border-radius:18px;padding:18px;transition:transform .35s var(--ease),border-color .3s,background .3s}
button.card{display:block;text-align:left;width:100%}
button.card:hover{transform:translateY(-5px);border-color:var(--acc);background:rgba(0,0,0,.4)}
.card svg{color:var(--acc);margin-bottom:12px;width:24px;height:24px;transition:transform .4s var(--ease)}
button.card:hover svg{transform:scale(1.2) rotate(-6deg)}
.card h3{font:600 17px "Space Grotesk"}
.card p{color:var(--muted);font-size:13px}

.seg{display:inline-flex;gap:4px;padding:4px;border-radius:14px;background:rgba(0,0,0,.3);margin-bottom:18px;flex-wrap:wrap}
.seg button{padding:7px 16px;border-radius:10px;color:var(--muted);transition:.3s var(--ease)}
.seg button.on{background:var(--acc);color:#07110f;font-weight:600}
.seg button:not(.on):hover{color:var(--text);background:rgba(255,255,255,.06)}
.btn{display:inline-flex;align-items:center;gap:8px;padding:9px 18px;border-radius:12px;background:var(--acc);color:#07110f;font-weight:600;text-decoration:none;transition:.25s var(--ease)}
.btn:hover{transform:translateY(-2px);filter:brightness(1.1)}.btn:active{transform:scale(.95)}
.btn.ghost{background:rgba(255,255,255,.08);color:var(--text)}
.btn[disabled]{opacity:.4;pointer-events:none}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin-bottom:12px}
.in{background:rgba(0,0,0,.35);border:1px solid var(--line);border-radius:12px;padding:9px 14px;outline:0;transition:.25s;min-width:0}
.in:focus{border-color:var(--acc)}
.list{display:flex;flex-direction:column;gap:8px}
.item{display:flex;align-items:center;gap:12px;padding:12px 14px;border-radius:14px;background:rgba(0,0,0,.28);border:1px solid var(--line);animation:pop .35s var(--ease);transition:.3s}
.item:hover{border-color:rgba(255,255,255,.2)}
.item .g{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis}
.item.done .g{text-decoration:line-through;color:var(--muted)}
.chk{width:22px;height:22px;border-radius:7px;border:2px solid var(--muted);display:grid;place-items:center;transition:.3s var(--ease)}
.done .chk{background:var(--acc);border-color:var(--acc);color:#07110f}
.ic{color:var(--muted);transition:.2s}.ic:hover{color:#fb7185;transform:scale(1.2)}
.empty{color:var(--muted);padding:24px;text-align:center;border:1px dashed var(--line);border-radius:14px}

canvas{max-width:100%;border-radius:16px;background:rgba(0,0,0,.4);border:1px solid var(--line)}
.stat{display:flex;gap:20px;margin-bottom:10px;color:var(--muted)}.stat b{color:var(--text)}
.pad{display:grid;grid-template-columns:repeat(3,52px);gap:6px;margin-top:12px}
.pad button{height:46px;border-radius:12px;background:rgba(255,255,255,.08);transition:.2s}.pad button:active{transform:scale(.9);background:var(--acc);color:#07110f}
.mem{display:grid;grid-template-columns:repeat(4,76px);gap:10px;perspective:700px}
.mc{height:76px;position:relative;transform-style:preserve-3d;transition:transform .5s var(--ease)}
.mc.f{transform:rotateY(180deg)}
.mc>*{position:absolute;inset:0;display:grid;place-items:center;border-radius:16px;backface-visibility:hidden;font-size:30px}
.mc .b{background:var(--panel);border:1px solid var(--line)}.mc:hover .b{border-color:var(--acc)}
.mc .fr{background:color-mix(in srgb,var(--acc) 22%,var(--panel));transform:rotateY(180deg)}
.mc.ok .fr{background:var(--acc);animation:pop .4s}
.ttt{display:grid;grid-template-columns:repeat(3,90px);gap:8px}
.ttt button{height:90px;border-radius:16px;background:rgba(0,0,0,.35);border:1px solid var(--line);font:600 38px "Space Grotesk";transition:.25s var(--ease)}
.ttt button:not(:disabled):hover{background:rgba(255,255,255,.08);transform:scale(1.05)}
.ttt button span{display:inline-block;animation:pop .3s var(--ease)}
.viz{width:100%;height:120px;margin-bottom:16px}
.moods{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px;margin-bottom:16px}
.moods .card.on{border-color:var(--acc);background:color-mix(in srgb,var(--acc) 14%,transparent)}
.chat{display:flex;flex-direction:column;height:calc(100% - 90px);min-height:300px}
.msgs{flex:1;overflow-y:auto;display:flex;flex-direction:column;gap:10px;padding:4px 2px 12px}
.m{max-width:80%;padding:10px 14px;border-radius:16px;background:rgba(0,0,0,.35);animation:pop .35s var(--ease);white-space:pre-wrap;overflow-wrap:anywhere}
.m.me{align-self:flex-end;background:color-mix(in srgb,var(--acc) 25%,transparent)}
.m small{display:block;color:var(--muted);font-size:11px}
.term{background:#050a09;border:1px solid var(--line);border-radius:16px;padding:16px;font:14px/1.5 ui-monospace,Menlo,Consolas,monospace;height:min(480px,60vh);overflow-y:auto;cursor:text}
.term .o{white-space:pre-wrap;overflow-wrap:anywhere}
.term .ln{display:flex;gap:8px}.term .ln span{color:var(--acc)}
.term input{flex:1;background:none;border:0;outline:0;font:inherit;min-width:0}
.swatches{display:flex;gap:12px;flex-wrap:wrap}
.sw{width:100px;padding:12px;border-radius:16px;border:1px solid var(--line);background:rgba(0,0,0,.28);text-align:center;transition:.3s var(--ease)}
.sw:hover{transform:translateY(-4px)}.sw.on{border-color:var(--acc)}
.sw i{display:block;width:100%;height:36px;border-radius:10px;margin-bottom:8px}
.sw small{display:block;color:var(--muted)}
.tog{width:46px;height:26px;border-radius:13px;background:rgba(255,255,255,.15);position:relative;transition:.3s}
.tog:after{content:"";position:absolute;top:3px;left:3px;width:20px;height:20px;border-radius:50%;background:#fff;transition:.3s var(--ease)}
.tog.on{background:var(--acc)}.tog.on:after{transform:translateX(20px)}
.web{display:flex;flex-direction:column;background:#fff}
.wbar{display:flex;gap:12px;align-items:center;padding:8px 14px;background:var(--panel);color:var(--muted);font-size:13px}
.wbar .u{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.wbar a{color:var(--acc);text-decoration:none;white-space:nowrap}
.wbar .n{animation:pop .4s;display:none}.wbar .n.show{display:inline}
.web iframe{flex:1;border:0;width:100%;background:#fff}
.web .ld{height:2px;background:var(--acc);width:0;animation:load 3s var(--ease) forwards}
@keyframes load{to{width:92%}}
.toast{position:fixed;left:50%;bottom:calc(24px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--text);color:#07110f;padding:10px 18px;border-radius:14px;font-weight:500;animation:pop .35s var(--ease);z-index:50}
@media(max-width:700px){
 .app{grid-template-columns:1fr;grid-template-rows:1fr auto}
 .dock{order:2;flex-direction:row;width:100%!important;overflow-x:auto;border-right:0;border-top:1px solid var(--line);padding:6px;box-shadow:none!important}
 .dock .sp{display:none}.dock button span{display:none}.dock button{padding:0 14px;flex:none}
 .main{order:1}
}

.dc{display:grid;grid-template-columns:72px 230px 1fr 210px;height:100%;background:#313338;position:relative;overflow:hidden;font-family:"DM Sans",sans-serif}
.dcsrv{background:#1e1f22;padding:12px;display:flex;flex-direction:column;gap:8px;align-items:center}
.dcsrv button{width:48px;height:48px;border-radius:24px;background:#5865f2;font:700 20px "Space Grotesk";color:#fff;transition:border-radius .25s var(--ease)}
.dcsrv button:hover{border-radius:16px}
.dcch{background:#2b2d31;padding:12px 8px;display:flex;flex-direction:column;gap:2px;min-width:0}
.dcch h4{font:600 16px "Space Grotesk";padding:8px 10px 14px;border-bottom:1px solid #1e1f22;margin-bottom:12px}
.dcch small,.dcmem small{color:#949ba4;font-size:11px;font-weight:600;letter-spacing:.04em;padding:0 10px 6px}
.dcch>button{display:flex;gap:8px;align-items:center;padding:7px 10px;border-radius:6px;color:#949ba4;text-align:left;transition:background .2s,color .2s,padding .25s var(--ease)}
.dcch>button i{font-style:normal;font-size:20px;color:#80848e}
.dcch>button:hover{background:#35373c;color:#dbdee1;padding-left:14px}
.dcch>button.on{background:#404249;color:#fff}
.dcme{margin-top:auto;display:flex;align-items:center;gap:10px;padding:10px;background:#232428;border-radius:8px}
.av{width:36px;height:36px;border-radius:50%;display:grid;place-items:center;font-weight:700;color:#fff;flex:none}
.dcmain{display:flex;flex-direction:column;min-width:0;min-height:0;color:#dbdee1}
.dchead{display:flex;gap:8px;align-items:center;padding:0 16px;height:48px;border-bottom:1px solid #26272b;flex:none}
.dchead i{font-style:normal;color:#80848e;font-size:22px}.dchead span{margin-left:auto;font-size:12px;color:#23a559}
.dcmsgs{flex:1;overflow-y:auto;padding:12px 0}
.dcmsgs.sw{animation:enter .35s var(--ease)}
.dcm{display:flex;gap:14px;padding:6px 16px;animation:pop .3s var(--ease)}
.dcm:hover{background:#2e3035}
.dcm b{font-weight:600}.dcm time{color:#949ba4;font-size:12px;margin-left:8px}
.dcm p{overflow-wrap:anywhere;white-space:pre-wrap;color:#dbdee1}
.dcm.sys{color:#949ba4;font-size:13px;padding-left:66px}
.dcin{padding:0 16px 20px;flex:none}
.dcin input{width:100%;background:#383a40;border:0;border-radius:8px;padding:12px 16px;outline:0;color:#dbdee1}
.dcmem{background:#2b2d31;padding:16px 8px;color:#dbdee1}
.dcm2{display:flex;align-items:center;gap:10px;padding:6px 10px}.dcm2 .av{width:32px;height:32px;font-size:14px}
.dcintro{position:absolute;inset:0;z-index:5;background:radial-gradient(circle at 50% 40%,#2b2d6b,#111214 70%);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:16px;transition:opacity .6s,transform .6s var(--ease);cursor:pointer}
.dcintro.gone{opacity:0;transform:scale(1.08);pointer-events:none}
.dcl{font:700 clamp(40px,9vw,84px)/1 "Space Grotesk";color:#fff;display:flex;text-shadow:0 0 40px #5865f2}
.dcl span{display:inline-block;animation:letter .8s var(--ease) both;animation-delay:var(--d)}
.dcintro p{color:#949ba4;font-size:13px;animation:pop .6s 1.4s both}
@keyframes letter{from{opacity:0;transform:translateY(30px) scale(.6);filter:blur(8px)}}
.auth{min-height:100%;display:grid;place-items:center;position:relative}
.authc{width:min(420px,100%);background:rgba(0,0,0,.35);border:1px solid var(--line);border-radius:22px;padding:28px;backdrop-filter:blur(10px);animation:pop .5s var(--ease)}
.authc label{display:block;color:var(--muted);font-size:13px;margin-bottom:12px}
.authc .in{display:block;width:100%;margin-top:6px;color:var(--text)}
.pw{display:flex;gap:8px;margin-top:6px}.pw .in{margin:0;flex:1}.pw .btn{padding:6px 14px}
.meter{height:5px;border-radius:3px;background:rgba(255,255,255,.1);margin:-4px 0 12px;overflow:hidden}.meter i{display:block;height:100%;width:0;transition:width .35s var(--ease),background .3s}
.err{color:#fb7185;min-height:22px;font-size:14px}.err.shake{animation:shake .4s}
@keyframes shake{20%,60%{transform:translateX(-6px)}40%,80%{transform:translateX(6px)}}
.prof{display:flex;align-items:center;gap:18px}.pav{width:72px;height:72px;border-radius:50%;background:var(--acc);color:#07110f;display:grid;place-items:center;font:700 30px "Space Grotesk";animation:pop .5s var(--ease)}
@media(max-width:900px){.dc{grid-template-columns:200px 1fr}.dcsrv,.dcmem{display:none}}
@media(max-width:700px){.dc{grid-template-columns:1fr;grid-template-rows:auto 1fr}.dcch{flex-direction:row;overflow-x:auto;padding:6px}.dcch h4,.dcch small,.dcme{display:none}.dcch>button{flex:none}}
</style>
</head>
<body>
<div class="app">
  <nav class="dock" id="dock" aria-label="Sections"></nav>
  <div class="main">
    <div class="strip" id="strip"></div>
    <div class="bar">
      <button id="back" aria-label="Back"><svg class="i" viewBox="0 0 24 24"><path d="M19 12H5M11 6l-6 6 6 6"/></svg></button>
      <button id="fwd" aria-label="Forward"><svg class="i" viewBox="0 0 24 24"><path d="M5 12h14M13 6l6 6-6 6"/></svg></button>
      <button id="reload" aria-label="Reload"><svg class="i" viewBox="0 0 24 24"><path d="M20 12a8 8 0 1 1-2.500-5.800M20 4v5h-5"/></svg></button>
      <form class="addr" id="af"><input id="addr" placeholder="Search or type a website" aria-label="Address" autocomplete="off"></form>
      <div class="coins" id="coins" title="Coins earned in games"></div>
    </div>
    <div class="stage"><div id="view"></div><div id="webs"></div></div>
  </div>
</div>
<script>

function go(raw){

  if(/^(https?:\/\/)?([a-z0-9-]+\.)+[a-z]{2,}(:\d+)?(\/\S*)?$/i.test(v)){const u=/^https?:/i.test(v)?v:'https://'+v;let h=v;try{h=new URL(u).hostname.replace(/^www\./,'')}catch(e){}addTab({k:'web',t:h,url:u})}
  else addTab({k:'web',t:v.slice(0,24),url:'https://en.m.wikipedia.org/w/index.php?search='+encodeURIComponent(v),alt:'https://duckduckgo.com/?q='+encodeURIComponent(v)});
}
function webNode(t){

function show(){

}
document.addEventListener('click',e=>{
  const x=e.target.closest('[data-x]');if(x){e.stopPropagation();return closeTab(+x.dataset.x)}

});

  const tick=()=>{const d=new Date(),hr=d.getHours();$('#hl',el).textContent=(hr<5?'Still up':hr<12?'Good morning':hr<18?'Good afternoon':'Good evening')+', '+S.name;
    $('#ck',el).textContent=d.toLocaleTimeString([],{hour:'numeric',minute:'2-digit',hour12:!S.h24}).replace(/\s?[AP]M/i,'')};

/* ---------- games ---------- */
function secGames(el){
  el.innerHTML=`<div class="glow"></div><div style="position:relative"><h1>Games</h1><p class="sub">Win rounds to earn coins for the shop.</p><div class="seg" id="gs"><button data-g="snake">Snake</button><button data-g="mem">Memory</button><button data-g="ttt">Tic-tac-toe</button></div><div id="gb"></div></div>`;
  const G={snake:gSnake,mem:gMem,ttt:gTtt};let gc=null;
  const pick=n=>{if(gc)gc();$$('#gs button',el).forEach(b=>b.classList.toggle('on',b.dataset.g===n));const b=$('#gb',el);b.innerHTML='';const w=document.createElement('div');w.className='enter';b.appendChild(w);gc=G[n](w)};
  $('#gs',el).onclick=e=>{const b=e.target.closest('[data-g]');if(b)pick(b.dataset.g)};
  pick('snake');return()=>gc&&gc();
}
function gSnake(b){
  b.innerHTML=`<div class="stat"><span>Score <b id="sc">0</b></span><span>Best <b id="bs">${S.hs.snake}</b></span></div><canvas id="cv" width="360" height="360"></canvas><div class="row" style="margin-top:12px"><button class="btn" id="go">Start</button><span class="sub" style="margin:0">Arrows or WASD</span></div><div class="pad"><i></i><button data-d="0,-1" aria-label="Up">▲</button><i></i><button data-d="-1,0" aria-label="Left">◀</button><button data-d="0,1" aria-label="Down">▼</button><button data-d="1,0" aria-label="Right">▶</button></div>`;
  const c=$('#cv',b).getContext('2d'),N=18,Z=20;let sn,dir,nd,food,sc,t=null,dead=false;
  const pl=()=>{let f;do f={x:Math.random()*N|0,y:Math.random()*N|0};while(sn.some(s=>s.x===f.x&&s.y===f.y));return f};
  function draw(){c.clearRect(0,0,360,360);c.fillStyle='rgba(255,255,255,.04)';for(let i=0;i<N;i++)for(let j=0;j<N;j++)if((i+j)%2)c.fillRect(i*Z,j*Z,Z,Z);
    c.fillStyle='#fbbf24';c.beginPath();c.arc(food.x*Z+10,food.y*Z+10,7,0,7);c.fill();
    sn.forEach((s,i)=>{c.globalAlpha=1-i/(sn.length+8);c.fillStyle=S.acc;c.beginPath();c.roundRect(s.x*Z+1,s.y*Z+1,Z-2,Z-2,6);c.fill()});c.globalAlpha=1;
    if(dead){c.fillStyle='rgba(0,0,0,.6)';c.fillRect(0,0,360,360);c.fillStyle='#fff';c.font='600 26px "Space Grotesk"';c.textAlign='center';c.fillText('Game over',180,185)}}
  function reset(){sn=[{x:9,y:9},{x:8,y:9},{x:7,y:9}];dir=nd={x:1,y:0};sc=0;dead=false;food=pl();$('#sc',b).textContent=0;draw()}
  function step(){const h={x:sn[0].x+nd.x,y:sn[0].y+nd.y};dir=nd;
    if(h.x<0||h.y<0||h.x>=N||h.y>=N||sn.some(s=>s.x===h.x&&s.y===h.y)){clearInterval(t);t=null;dead=true;if(sc>S.hs.snake){S.hs.snake=sc;$('#bs',b).textContent=sc}earn(sc);save();$('#go',b).textContent='Play again';return draw()}
    sn.unshift(h);if(h.x===food.x&&h.y===food.y){sc++;$('#sc',b).textContent=sc;food=pl()}else sn.pop();draw()}
  const turn=(x,y)=>{if(x!==-dir.x||y!==-dir.y)nd={x,y}};
  const kd=e=>{const m={ArrowUp:[0,-1],w:[0,-1],ArrowDown:[0,1],s:[0,1],ArrowLeft:[-1,0],a:[-1,0],ArrowRight:[1,0],d:[1,0]}[e.key];if(m&&t){e.preventDefault();turn(...m)}};
  document.addEventListener('keydown',kd);
  $('#go',b).onclick=()=>{clearInterval(t);reset();t=setInterval(step,115);$('#go',b).textContent='Restart'};
  $$('.pad button',b).forEach(p=>p.onclick=()=>turn(...p.dataset.d.split(',').map(Number)));
  reset();return()=>{clearInterval(t);document.removeEventListener('keydown',kd)};
}
function gMem(b){
  const em=['🌙','🔥','🌊','🍀','⭐','🎲','🪐','🍉'],d=[...em,...em].sort(()=>Math.random()-.5);let open=[],moves=0,lock=false,found=0;
  b.innerHTML=`<div class="stat"><span>Moves <b id="mv">0</b></span><span>Best <b>${S.hs.mem||'–'}</b></span></div><div class="mem">${d.map((e,i)=>`<button class="mc" data-i="${i}" aria-label="Card"><div class="b"></div><div class="fr">${e}</div></button>`).join('')}</div><div class="row" style="margin-top:14px"><button class="btn ghost" id="rs">New game</button></div>`;
  $('#rs',b).onclick=()=>{b.innerHTML='';gMem(b)};
  $$('.mc',b).forEach(c=>c.onclick=()=>{if(lock||c.classList.contains('f'))return;c.classList.add('f');open.push(c);
    if(open.length===2){moves++;$('#mv',b).textContent=moves;const[a,z]=open;
      if(d[a.dataset.i]===d[z.dataset.i]){a.classList.add('ok');z.classList.add('ok');open=[];if(++found===8){const e=Math.max(2,14-moves);earn(e);if(!S.hs.mem||moves<S.hs.mem){S.hs.mem=moves;save()}}}
      else{lock=true;setTimeout(()=>{a.classList.remove('f');z.classList.remove('f');open=[];lock=false},800)}}});
  return()=>{};
}
function gTtt(b){
  let bd=Array(9).fill(''),over=false;const L=[[0,1,2],[3,4,5],[6,7,8],[0,3,6],[1,4,7],[2,5,8],[0,4,8],[2,4,6]];
  const win=p=>L.some(l=>l.every(i=>bd[i]===p));
  const find=p=>{for(const l of L){const v=l.map(i=>bd[i]);if(v.filter(x=>x===p).length===2&&v.includes(''))return l[v.indexOf('')]}return -1};
  function ai(){let m=find('O');if(m<0)m=find('X');if(m<0&&!bd[4])m=4;if(m<0){const o=[0,2,6,8,1,3,5,7].filter(i=>!bd[i]);m=o[Math.random()*Math.min(o.length,3)|0]}bd[m]='O'}
  function draw(msg){b.innerHTML=`<p class="sub" id="tm">${msg||'You are X. Your move.'}</p><div class="ttt">${bd.map((v,i)=>`<button data-i="${i}" ${v||over?'disabled':''} aria-label="Cell ${i+1}"><span>${v}</span></button>`).join('')}</div><div class="row" style="margin-top:14px"><button class="btn ghost" id="rs">New game</button></div>`;
    $('#rs',b).onclick=()=>{bd=Array(9).fill('');over=false;draw()};
    $$('.ttt button',b).forEach(c=>c.onclick=()=>{bd[c.dataset.i]='X';
      if(win('X')){over=true;earn(3);return draw('You win!')}
      if(bd.every(x=>x)){over=true;earn(1);return draw('A draw.')}
      ai();if(win('O')){over=true;return draw('The computer wins this one.')}
      if(bd.every(x=>x)){over=true;earn(1);return draw('A draw.')}draw()})}
  draw();return()=>{};
}

function secAI(el){
  el.innerHTML=`<div class="glow"></div><div style="position:relative;height:100%;display:flex;flex-direction:column"><h1>AI</h1><p class="sub">Ask anything. Answers come from Claude.</p><div class="msgs" id="ms"><div class="m">What can I help you with?</div></div><form class="row" id="af2" style="margin:0"><input class="in" id="ai" placeholder="Ask a question" style="flex:1" aria-label="Message" autocomplete="off"><button class="btn" id="sb">${ic('send')}Send</button></form></div>`;
  const hist=[],ms=$('#ms',el);let sample=null,busy=false,ac=null;
  cap('sample').then(s=>{sample=s;if(!s)add('AI answers aren’t available in this view.',false)});
  const add=(t,me)=>{const d=document.createElement('div');d.className='m'+(me?' me':'');d.textContent=t;ms.appendChild(d);ms.scrollTop=ms.scrollHeight;return d};
  $('#af2',el).onsubmit=async e=>{e.preventDefault();const q=$('#ai',el).value.trim();if(!q||busy||!sample)return;$('#ai',el).value='';add(q,true);
    hist.push({role:'user',content:q});const out=add('Thinking…',false);busy=true;ac=new AbortController();
    const msgs=hist.map((m,i)=>i===hist.length-1?{role:'user',content:'You are the helper inside a small browser start page. Answer clearly and briefly.\n\n'+m.content}:m);
    try{const r=await sample(msgs,{cache:false,signal:ac.signal,onText:u=>{out.textContent=u.text||'Thinking…';ms.scrollTop=ms.scrollHeight}});out.textContent=r.text;hist.push({role:'assistant',content:r.text})}
    catch(err){out.textContent=err&&err.code==='not_granted'?'Permission was declined, so I can’t answer.':'That didn’t work. Try again in a moment.';hist.pop()}busy=false};
  return()=>ac&&ac.abort();
}

/* ---------- chat ---------- */
const LOG={general:[],random:[],games:[]};
function secChat(el){
  el.style.padding='0';
  const hue=s=>[...s].reduce((a,c)=>a+c.charCodeAt(0)*13,0)%360,av=n=>`<span class="av" style="background:hsl(${hue(n)} 55% 48%)">${esc(n[0].toUpperCase())}</span>`;
  el.innerHTML=`<div class="dc"><div class="dcintro" id="dci"><div class="dcl">${'Lumen Chat'.split('').map((c,i)=>`<span style="--d:${i*80}ms">${c===' '?'&nbsp;':c}</span>`).join('')}</div><p>Tap to skip</p></div>
  <div class="dcsrv"><button aria-label="Lumen server">L</button></div>
  <div class="dcch"><h4>Lumen</h4><small>TEXT CHANNELS</small>${['general','random','games'].map((c,i)=>`<button data-c="${c}" class="${i?'':'on'}"><i>#</i>${c}</button>`).join('')}<div class="dcme">${av(S.name)}<b>${esc(S.name)}</b></div></div>
  <div class="dcmain"><div class="dchead"><i>#</i><b id="cn">general</b><span id="cs">Connecting…</span></div><div class="dcmsgs" id="cm"></div><form class="dcin" id="cf"><input id="cinp" placeholder="Message #general" aria-label="Message" autocomplete="off" maxlength="500"></form></div>
  <div class="dcmem"><small>ONLINE</small><div class="dcm2">${av(S.name)}<b>${esc(S.name)}</b></div><div id="cml" class="sub" style="font-size:13px;margin:8px 0 0"></div></div></div>`;
  let ch='general',room=null,offs=[],tm=[];
  const msgs=$('#cm',el),now=()=>new Date().toLocaleTimeString([],{hour:'numeric',minute:'2-digit'});
  const row=m=>{const d=document.createElement('div');if(m.sys){d.className='dcm sys';d.textContent=m.t}else{d.className='dcm';d.innerHTML=`${av(m.n)}<div><b style="color:hsl(${hue(m.n)} 70% 72%)">${esc(m.n)}</b><time>${esc(m.tm)}</time><p></p></div>`;$('p',d).textContent=m.t}msgs.appendChild(d);msgs.scrollTop=msgs.scrollHeight};
  const draw=()=>{msgs.innerHTML='';if(!LOG[ch].length)LOG[ch].push({sys:1,t:'This is the start of #'+ch+'.'});LOG[ch].forEach(row)};
  const push=(c,m)=>{if(!LOG[c])return;LOG[c].push(m);if(c===ch)row(m)};
  draw();
  $('.dcch',el).onclick=e=>{const b=e.target.closest('[data-c]');if(!b)return;ch=b.dataset.c;$$('.dcch [data-c]',el).forEach(x=>x.classList.toggle('on',x===b));$('#cn',el).textContent=ch;$('#cinp',el).placeholder='Message #'+ch;msgs.classList.remove('sw');void msgs.offsetWidth;msgs.classList.add('sw');draw()};
  const gone=()=>{const i=$('#dci',el);if(i&&!i.classList.contains('gone')){i.classList.add('gone');tm.push(setTimeout(()=>i.remove(),700))}};
  tm.push(setTimeout(gone,2800));$('#dci',el).onclick=gone;
  cap('room').then(r=>{room=r;const s=$('#cs',el);if(!s)return;
    if(!r){s.textContent='Offline · only you see messages';return}
    s.textContent='● Live';
    offs.push(r.on('msg',m=>{if(m.isMe||!m.data)return;const d=m.data;push(String(d.c||'general'),{n:String(d.n||'guest').slice(0,20),t:String(d.t||'').slice(0,500),tm:now()})}));
    offs.push(r.onPeers(c=>{const n=Math.max(0,c.peers.length-1);$('#cml',el).textContent=n?n+(n===1?' other person':' other people')+' here':'No one else is here yet'}))});
  $('#cf',el).onsubmit=e=>{e.preventDefault();const i=$('#cinp',el),v=i.value.trim();if(!v)return;i.value='';push(ch,{n:S.name,t:v,tm:now()});if(room)room.emit('msg',{n:S.name,t:v,c:ch}).catch(()=>toast('Message not sent'))};
  return()=>{tm.forEach(clearTimeout);offs.forEach(f=>{try{f&&f()}catch(e){}})};
}

/* ---------- sandbox shell ---------- */
function secVMs(el){
  el.innerHTML=`<div class="glow"></div><div style="position:relative;max-width:760px"><h1>Sandbox</h1><p class="sub">A small shell that runs inside this page. Try <code>help</code>.</p><div class="term" id="tm"><div id="to"></div><div class="ln"><span>$</span><input id="ti" autocomplete="off" spellcheck="false" aria-label="Command"></div></div></div>`;
  const to=$('#to',el),ti=$('#ti',el),tm=$('#tm',el),H=[];let hp=0;const F={'readme.txt':'Welcome to the Lumen sandbox.','todo.txt':'- play a game\n- earn coins\n- unlock a color'};
  const say=t=>{const d=document.createElement('div');d.className='o';d.textContent=t;to.appendChild(d);tm.scrollTop=tm.scrollHeight};
  say('Lumen sandbox v1. Type "help" for commands.');
  const C={help:()=>'help  ls  cat <file>  echo <text>  date  whoami  calc <expr>  open <url>  neofetch  clear',
   ls:()=>Object.keys(F).join('  '),cat:a=>F[a]??'cat: '+a+': no such file',echo:a=>a,date:()=>new Date().toString(),whoami:()=>S.name,
   calc:a=>{if(!/^[\d+\-*/().%\s^]+$/.test(a)||!a.trim())return'calc: use numbers and + - * / ^ ( )';try{return String(Function('"use strict";return ('+a.replace(/\^/g,'**')+')')())}catch(e){return'calc: invalid expression'}},
   open:a=>{if(!a)return'open: give a URL';go(a);return'Opening '+a},
   neofetch:()=>`${S.name}@lumen\n----------\nCoins: ${S.coins}\nTabs: ${tabs.length}\nBest snake: ${S.hs.snake}\nBrowser: ${navigator.userAgent.split(' ').pop()}`,
   clear:()=>{to.innerHTML='';return null}};
  ti.onkeydown=e=>{
    if(e.key==='Enter'){const v=ti.value;ti.value='';say('$ '+v);if(v.trim()){H.push(v);hp=H.length;const[c,...r]=v.trim().split(/\s+/);const f=C[c];const o=f?f(r.join(' ')):c+': command not found';if(o!==null)say(o)}}
    else if(e.key==='ArrowUp'&&hp>0){ti.value=H[--hp];e.preventDefault()}
    else if(e.key==='ArrowDown'){ti.value=H[++hp]||'';hp=Math.min(hp,H.length)}};
  tm.onclick=()=>ti.focus();
}

/* ---------- linkgen ---------- */
function secLinkgen(el){
  const g=S.gl||{u:'markakopian-sudo',r:'Lumen'};
  el.innerHTML=`<div class="glow"></div><div style="position:relative;max-width:720px"><h1>Linkgen</h1><p class="sub">Make different links that all open Lumen. Hand out a fresh one whenever you like.</p>
  <div class="row"><input class="in" id="gu" value="${esc(g.u)}" aria-label="GitHub username" placeholder="GitHub username"><input class="in" id="gr" value="${esc(g.r)}" aria-label="Repo name" placeholder="Repo"><button class="btn" id="gg">Generate</button><button class="btn ghost" id="gf">Fresh set</button></div>
  <div class="list" id="gl"></div>
  <h3 style="margin:28px 0 8px;font:600 18px 'Space Grotesk'">Saved shortcuts</h3><form class="row" id="lf"><input class="in" id="ln" placeholder="Name" style="width:140px" aria-label="Name"><input class="in" id="lu" placeholder="example.com/page" style="flex:1" aria-label="URL"><button class="btn">Save</button></form><div class="list" id="ll"></div></div>`;
  const tok=()=>Math.random().toString(36).slice(2,8);
  const mk=(fresh)=>{let u=$('#gu',el).value.trim().replace(/[^\w.-]/g,''),r=$('#gr',el).value.trim().replace(/[^\w.-]/g,'');if(!u||!r)return toast('Enter your username and repo');S.gl={u,r};save();const q=fresh?'?v='+tok():'';
    const L=[['GitHub Pages',`https://${u}.github.io/${r}/${q}`],['jsDelivr (SVG)',`https://cdn.jsdelivr.net/gh/${u}/${r}@latest/index.svg${q}`],['jsDelivr (main branch)',`https://cdn.jsdelivr.net/gh/${u}/${r}@main/index.svg${q}`],['GitHack',`https://raw.githack.com/${u}/${r}/main/index.html${q}`],['Statically',`https://cdn.statically.io/gh/${u}/${r}/main/index.html${q}`]];
    $('#gl',el).innerHTML=L.map(([n,l],i)=>`<div class="item"><span class="g"><b>${n}</b><br><span class="sub" style="margin:0;font-size:12px">${esc(l)}</span></span><button class="btn ghost" data-og="${i}">Open</button><button class="btn ghost" data-cg="${i}">Copy</button></div>`).join('');$('#gl',el)._l=L};
  $('#gg',el).onclick=()=>mk(false);$('#gf',el).onclick=()=>mk(true);mk(false);
  $('#gl',el).onclick=e=>{const o=e.target.closest('[data-og]'),c=e.target.closest('[data-cg]'),L=$('#gl',el)._l;
    if(o)window.open(L[o.dataset.og][1],'_blank','noopener');
    if(c)navigator.clipboard.writeText(L[c.dataset.cg][1]).then(()=>toast('Copied'),()=>toast('Copy blocked by the browser'))};
  const r=()=>{$('#ll',el).innerHTML=S.links.length?S.links.map((l,i)=>`<div class="item"><span class="g"><b>${esc(l.n)}</b> <span class="sub" style="margin:0">${esc(l.u)}</span></span><button class="btn ghost" data-o="${i}">Open</button><button class="ic" data-d="${i}" aria-label="Remove">${ic('trash')}</button></div>`).join(''):'<div class="empty">No saved shortcuts yet. They show up on Home.</div>'};r();
  $('#lf',el).onsubmit=e=>{e.preventDefault();let u=$('#lu',el).value.trim(),n=$('#ln',el).value.trim();if(!u)return;if(!/^https?:\/\//i.test(u))u='https://'+u;
    try{const U=new URL(u);['utm_source','utm_medium','utm_campaign','fbclid','gclid'].forEach(k=>U.searchParams.delete(k));u=U.href;if(!n)n=U.hostname.replace(/^www\./,'')}catch(x){return toast('That doesn’t look like a link')}
    S.links.push({n,u});save();$('#lu',el).value='';$('#ln',el).value='';r();toast('Saved')};
  $('#ll',el).onclick=e=>{const o=e.target.closest('[data-o]'),d=e.target.closest('[data-d]');if(o)go(S.links[o.dataset.o].u);if(d){S.links.splice(d.dataset.d,1);save();r()}};
}

/* ---------- shop / account / settings ---------- */
const COLORS=[['Aqua','#5eead4',0],['Amber','#fbbf24',10],['Coral','#fb7185',15],['Violet','#a78bfa',20],['Lime','#a3e635',25],['Sky','#38bdf8',30]];
function secShop(el){
  const r=()=>{el.innerHTML=`<div class="glow"></div><div style="position:relative"><h1>Shop</h1><p class="sub">You have <b>${S.coins}</b> coins. Earn more in Games.</p><div class="swatches">${COLORS.map(([n,c,p])=>{const own=S.own.includes(c);return `<button class="sw ${S.acc===c?'on':''}" data-c="${c}"><i style="background:${c}"></i>${n}<small>${S.acc===c?'In use':own?'Use':p+' coins'}</small></button>`}).join('')}</div></div>`};r();
  el.onclick=e=>{const b=e.target.closest('[data-c]');if(!b)return;const[,c,p]=COLORS.find(x=>x[1]===b.dataset.c);
    if(!S.own.includes(c)){if(S.coins<p)return toast('Need '+(p-S.coins)+' more coins');S.coins-=p;S.own.push(c);toast('Unlocked')}
    S.acc=c;save();applyTheme();r()};
}
const getAcc=()=>{try{return JSON.parse(localStorage.getItem('lumen_accounts')||'{}')}catch(e){return{}}};
const setAcc=a=>{try{localStorage.setItem('lumen_accounts',JSON.stringify(a))}catch(e){}};
async function hashPw(p,salt){const t=salt+':'+p;if(window.crypto&&crypto.subtle){const b=await crypto.subtle.digest('SHA-256',new TextEncoder().encode(t));return[...new Uint8Array(b)].map(x=>x.toString(16).padStart(2,'0')).join('')}let h=5381;for(const c of t)h=((h*33)^c.charCodeAt(0))>>>0;return String(h)}
let fails=0,lock=0;
function secAccount(el){
  let mode='in';
  const login=u=>{S.user=u;S.name=u;save();draw()};
  function auth(){
    const up=mode==='up';
    el.innerHTML=`<div class="glow"></div><div class="auth"><div class="authc"><h1>${up?'Create account':'Welcome back'}</h1><p class="sub">${up?'It takes about ten seconds.':'Sign in to pick up where you left off.'}</p>
    <div class="seg" id="am"><button data-m="in" class="${up?'':'on'}">Sign in</button><button data-m="up" class="${up?'on':''}">Sign up</button></div>
    <form id="af3" novalidate>
    <label>${up?'Username':'Username or email'}<input class="in" id="au" autocomplete="username" maxlength="40"></label>
    ${up?'<label>Email<input class="in" id="ae" type="email" autocomplete="email"></label>':''}
    <label>Password<span class="pw"><input class="in" id="ap" type="password" autocomplete="${up?'new-password':'current-password'}"><button type="button" id="sp" class="btn ghost">Show</button></span></label>
    ${up?'<div class="meter"><i id="mt"></i></div><label>Confirm password<input class="in" id="ac" type="password" autocomplete="new-password"></label>':''}
    <p class="err" id="er" role="alert"></p><button class="btn" style="width:100%;justify-content:center">${up?'Create account':'Sign in'}</button></form>
    <p class="sub" style="margin:14px 0 0;font-size:13px">${up?'Accounts are saved in this browser on this device. Nothing is sent anywhere.':'Forgot your password? Accounts live on this device only, so it can’t be recovered. You can create a new one.'}</p></div></div>`;
    $('#am',el).onclick=e=>{const b=e.target.closest('[data-m]');if(b){mode=b.dataset.m;auth()}};
    $('#sp',el).onclick=()=>{const p=$('#ap',el),h=p.type==='password';p.type=h?'text':'password';$('#sp',el).textContent=h?'Hide':'Show'};
    if(up)$('#ap',el).oninput=e=>{const v=e.target.value;let n=0;if(v.length>=8)n++;if(v.length>=12)n++;if(/[A-Z]/.test(v)&&/[a-z]/.test(v))n++;if(/\d/.test(v)&&/[^\w]/.test(v))n++;const m=$('#mt',el);m.style.width=n*25+'%';m.style.background=['#fb7185','#fb7185','#fbbf24','#a3e635','#5eead4'][n]};
    $('#af3',el).onsubmit=async e=>{e.preventDefault();
      const err=m=>{const x=$('#er',el);x.textContent=m;x.classList.remove('shake');void x.offsetWidth;x.classList.add('shake')};
      const u=$('#au',el).value.trim().toLowerCase(),p=$('#ap',el).value,A=getAcc();
      if(up){const em=$('#ae',el).value.trim().toLowerCase();
        if(!/^[a-z0-9_]{3,20}$/.test(u))return err('Username: 3 to 20 letters, numbers or underscores.');
        if(!/^\S+@\S+\.\S+$/.test(em))return err('Enter a valid email address.');
        if(p.length<8)return err('Password needs at least 8 characters.');
        if(p!==$('#ac',el).value)return err('The passwords don’t match.');
        if(A[u])return err('That username is taken.');
        if(Object.values(A).some(a=>a.email===em))return err('That email is already in use.');
        const salt=Math.random().toString(36).slice(2)+Date.now().toString(36);
        A[u]={email:em,salt,hash:await hashPw(p,salt),since:Date.now()};setAcc(A);toast('Account created');login(u)}
      else{if(!u||!p)return err('Enter your username and password.');if(Date.now()<lock)return err('Too many tries. Wait a few seconds.');
        const k=A[u]?u:Object.keys(A).find(x=>A[x].email===u);
        if(!k||(await hashPw(p,A[k].salt))!==A[k].hash){if(++fails>=5){lock=Date.now()+30000;fails=0}return err('Wrong username or password.')}
        fails=0;toast('Signed in');login(k)}}}
  function prof(){
    const a=getAcc()[S.user]||{};
    el.innerHTML=`<div class="glow"></div><div style="position:relative;max-width:560px"><div class="prof"><span class="pav">${esc(S.user[0].toUpperCase())}</span><div><h1 style="margin:0">${esc(S.user)}</h1><p class="sub" style="margin:0">${esc(a.email||'')} · member since ${a.since?new Date(a.since).toLocaleDateString():'today'}</p></div></div>
    <div class="bento" style="grid-template-columns:repeat(3,1fr);margin:22px 0"><div class="card"><h3>${S.coins}</h3><p>Coins</p></div><div class="card"><h3>${S.hs.snake}</h3><p>Best snake</p></div><div class="card"><h3>${S.watch.filter(w=>w.d).length}/${S.watch.length}</h3><p>Movies watched</p></div></div>
    <div class="row"><button class="btn" id="so">Sign out</button><button class="btn ghost" id="dl">Delete account</button></div><p class="sub" style="font-size:13px">Coins, scores and your watchlist stay on this device.</p></div>`;
    $('#so',el).onclick=()=>{S.user=null;S.name='guest';save();toast('Signed out');draw()};
    $('#dl',el).onclick=()=>{const b=$('#dl',el);if(!b.dataset.s){b.textContent='Click again to confirm';b.dataset.s=1;return}const A=getAcc();delete A[S.user];setAcc(A);S.user=null;S.name='guest';save();draw()};
  }
  function draw(){if(S.user&&getAcc()[S.user])prof();else{S.user=null;auth()}}
  draw();
}
function secSettings(el){
  const r=()=>{const tg=(k,l)=>`<div class="item"><span class="g">${l}</span><button class="tog ${S[k]?'on':''}" data-k="${k}" role="switch" aria-checked="${!!S[k]}" aria-label="${l}"></button></div>`;
    el.innerHTML=`<div class="glow"></div><div style="position:relative;max-width:560px"><h1>Settings</h1><p class="sub">Changes apply right away.</p><div class="list">${tg('anim','Animations')}${tg('h24','24-hour clock')}</div><h3 style="margin:22px 0 10px;font:600 17px 'Space Grotesk'">Accent color</h3><div class="row">${S.own.map(c=>`<button class="sw ${S.acc===c?'on':''}" data-c="${c}" style="width:56px;padding:8px" aria-label="Accent ${c}"><i style="background:${c};margin:0"></i></button>`).join('')}</div><p class="sub">More colors are in the Shop.</p></div>`};r();
  el.onclick=e=>{const k=e.target.closest('[data-k]'),c=e.target.closest('[data-c]');if(k)S[k.dataset.k]=!S[k.dataset.k];if(c)S.acc=c.dataset.c;if(k||c){save();applyTheme();r()}};
}

renderDock();applyTheme();show();
</script>
