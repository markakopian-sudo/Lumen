<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Lumen</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=DM+Sans:wght@400;500;600&family=Mrs+Saint+Delafield&display=swap">
<style>
:root{color-scheme:dark;--bg:#000;--panel:#0a0a0a;--panel2:#050505;--line:rgba(255,255,255,.1);--text:#f2f2f2;--muted:#8c8c8c;--acc:#5eead4;--ease:cubic-bezier(.22,1,.36,1);
 box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
*{box-sizing:border-box;margin:0}
[hidden]{display:none!important}
html,body{height:100%}
body{background:var(--bg);color:var(--text);font:400 15px/1.5 var(--fb,"DM Sans"),system-ui,sans-serif;overflow:hidden}
button,input,select{font:inherit;color:inherit}
button{background:none;border:0;cursor:pointer}
code{background:rgba(255,255,255,.08);padding:1px 6px;border-radius:5px}
:focus-visible{outline:2px solid var(--acc);outline-offset:2px}
svg.i{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round;flex:none}
h1{font:600 28px/1.1 "Space Grotesk",sans-serif;margin-bottom:6px}
.sub{color:var(--muted);margin-bottom:18px}
.noanim *,.noanim *:before,.noanim *:after{animation-duration:0s!important;transition-duration:0s!important;animation-delay:0s!important}
@media (prefers-reduced-motion:reduce){*,*:before,*:after{animation-duration:0s!important;transition-duration:0s!important}}

.app{display:grid;grid-template-columns:72px 1fr;height:100%;position:relative;z-index:1}
#bg{position:fixed;inset:0;width:100%;height:100%;z-index:0;pointer-events:none;background:#000}
.dock{display:flex;flex-direction:column;gap:4px;padding:14px 12px;background:rgba(6,6,6,.55);backdrop-filter:blur(16px);border-right:1px solid var(--line);width:72px;transition:width .35s var(--ease);overflow:hidden;z-index:5;position:relative}
.dock:hover,.dock:focus-within{width:210px;box-shadow:12px 0 40px rgba(0,0,0,.4)}
.dock button{display:flex;align-items:center;gap:16px;height:44px;padding:0 12px;border-radius:12px;color:var(--muted);white-space:nowrap;transition:background .25s,color .25s,transform .2s var(--ease)}
.dock button span{opacity:0;transition:opacity .25s}
.dock:hover button span,.dock:focus-within button span{opacity:1}
.dock button:hover{background:rgba(255,255,255,.06);color:var(--text);transform:translateX(3px)}
.dock button.on{background:color-mix(in srgb,var(--acc) 16%,transparent);color:var(--acc)}
.dock .sp{flex:1}
.main{display:flex;flex-direction:column;min-width:0;min-height:0}
.strip{display:flex;align-items:flex-end;gap:4px;padding:10px 12px 0;overflow-x:auto;scrollbar-width:none}
.tab{display:flex;align-items:center;gap:8px;max-width:190px;min-width:90px;height:38px;padding:0 10px 0 12px;border-radius:12px 12px 0 0;color:var(--muted);background:transparent;cursor:pointer;transition:background .3s,color .3s,max-width .35s var(--ease),opacity .3s;overflow:hidden;flex:none}
.tab.new{animation:tabin .4s var(--ease)}
.tab.out{max-width:0;min-width:0;padding:0;opacity:0}
.tab:hover{background:rgba(255,255,255,.05)}
.tab.on{background:rgba(255,255,255,.1);color:var(--text)}
.tab .t{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-size:14px}
.tab .x{width:22px;height:22px;display:grid;place-items:center;border-radius:6px;opacity:.6;transition:.2s}
.tab .x:hover{background:rgba(255,255,255,.12);opacity:1;transform:rotate(90deg)}
.plus{width:34px;height:34px;display:grid;place-items:center;border-radius:10px;color:var(--muted);margin-bottom:2px;flex:none;transition:.3s var(--ease)}
.plus:hover{background:rgba(255,255,255,.08);color:var(--text);transform:rotate(90deg)}
.bar{display:flex;align-items:center;gap:6px;padding:8px 12px;background:rgba(0,0,0,.4);backdrop-filter:blur(12px)}
.bar>button{width:34px;height:34px;display:grid;place-items:center;border-radius:10px;color:var(--muted);transition:.25s}
.bar>button:hover{background:rgba(255,255,255,.08);color:var(--text)}
.bar>button:active{transform:scale(.88)}
#reload:active svg{transform:rotate(360deg);transition:transform .5s var(--ease)}
.addr{flex:1;display:flex;min-width:0}
.addr input{flex:1;min-width:0;height:36px;background:var(--bg);border:1px solid var(--line);border-radius:12px;padding:0 14px;outline:0;transition:border-color .25s,box-shadow .3s}
.addr input:focus{border-color:var(--acc);box-shadow:0 0 0 4px color-mix(in srgb,var(--acc) 18%,transparent)}
.coins{display:flex;align-items:center;gap:6px;padding:0 12px;height:34px;border-radius:10px;background:rgba(251,191,36,.12);color:#fbbf24;font-weight:600;white-space:nowrap;transition:transform .3s var(--ease)}
.coins.pop{transform:scale(1.18)}
.stage{position:relative;flex:1;min-height:0;overflow:hidden}
#view,#webs>*{position:absolute;inset:0}
.pane{height:100%;overflow-y:auto;padding:28px clamp(16px,4vw,48px) 40px;position:relative}
.enter{animation:enter .5s var(--ease)}
.glow{position:absolute;inset:0;pointer-events:none;background:radial-gradient(60% 50% at 20% 0%,color-mix(in srgb,var(--acc) 18%,transparent),transparent 70%),radial-gradient(50% 40% at 100% 100%,rgba(251,191,36,.1),transparent 70%);animation:breathe 9s ease-in-out infinite alternate}
@keyframes enter{from{opacity:0;transform:translateY(14px) scale(.99)}}
@keyframes tabin{from{max-width:0;opacity:0}}
@keyframes rise{from{opacity:0;transform:translateY(22px)}}
@keyframes breathe{to{opacity:.55;transform:scale(1.06)}}
@keyframes pop{from{opacity:0;transform:scale(.92) translateY(6px)}}

.home{max-width:880px;margin:0 auto;text-align:center;padding-top:3vh;position:relative}
.hello{color:var(--muted)}
.clock{font:500 clamp(54px,9vw,92px)/1 "Space Grotesk",sans-serif;letter-spacing:-.03em;margin:4px 0 2px}
.mark{font:700 18px "Space Grotesk",sans-serif;letter-spacing:.3em;color:var(--acc);margin-bottom:22px}
.search{display:flex;align-items:center;gap:12px;max-width:560px;margin:0 auto 20px;height:54px;padding:0 20px;border-radius:27px;background:rgba(0,0,0,.35);border:1px solid var(--line);transition:.35s var(--ease)}
.search:focus-within{border-color:var(--acc);box-shadow:0 8px 40px color-mix(in srgb,var(--acc) 25%,transparent);transform:translateY(-2px)}
.search input{flex:1;background:none;border:0;outline:0;font-size:16px;min-width:0}
.quick{display:flex;flex-wrap:wrap;justify-content:center;gap:14px;margin-bottom:30px}
.q{width:76px;display:flex;flex-direction:column;align-items:center;gap:6px;font-size:12px;color:var(--muted);transition:.3s var(--ease)}
.q b{position:relative;overflow:hidden;width:52px;height:52px;border-radius:16px;display:grid;place-items:center;font:600 20px "Space Grotesk";color:#07110f;transition:.3s var(--ease)}
.q:hover{transform:translateY(-4px);color:var(--text)}
.q b img{position:absolute;inset:0;width:100%;height:100%;object-fit:contain;background:#fff;padding:7px}.q:hover b{border-radius:22px}
.bento{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:12px;text-align:left}
.bento>*{animation:rise .6s var(--ease) both;animation-delay:calc(var(--i)*60ms)}
.card{background:rgba(0,0,0,.28);border:1px solid var(--line);border-radius:18px;padding:18px;transition:transform .35s var(--ease),border-color .3s,background .3s}
button.card{display:block;text-align:left;width:100%}
button.card:hover{transform:translateY(-5px);border-color:var(--acc);background:rgba(0,0,0,.4)}
.card svg{color:var(--acc);margin-bottom:12px;width:24px;height:24px;transition:transform .4s var(--ease)}
button.card:hover svg{transform:scale(1.2) rotate(-6deg)}
.card h3{font:600 17px "Space Grotesk"}
.card p{color:var(--muted);font-size:13px}

.seg{display:inline-flex;gap:4px;padding:4px;border-radius:14px;background:rgba(0,0,0,.3);margin-bottom:18px;flex-wrap:wrap}
.seg button{padding:7px 16px;border-radius:10px;color:var(--muted);transition:.3s var(--ease)}
.seg button.on{background:var(--acc);color:#07110f;font-weight:600}
.seg button:not(.on):hover{color:var(--text);background:rgba(255,255,255,.06)}
.btn{display:inline-flex;align-items:center;gap:8px;padding:9px 18px;border-radius:12px;background:var(--acc);color:#07110f;font-weight:600;text-decoration:none;transition:.25s var(--ease)}
.btn:hover{transform:translateY(-2px);filter:brightness(1.1)}.btn:active{transform:scale(.95)}
.btn.ghost{background:rgba(255,255,255,.08);color:var(--text)}
.btn[disabled]{opacity:.4;pointer-events:none}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin-bottom:12px}
.in{background:rgba(0,0,0,.35);border:1px solid var(--line);border-radius:12px;padding:9px 14px;outline:0;transition:.25s;min-width:0}
.in:focus{border-color:var(--acc)}
.list{display:flex;flex-direction:column;gap:8px}
.item{display:flex;align-items:center;gap:12px;padding:12px 14px;border-radius:14px;background:rgba(0,0,0,.28);border:1px solid var(--line);animation:pop .35s var(--ease);transition:.3s}
.item:hover{border-color:rgba(255,255,255,.2)}
.item .g{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis}
.item.done .g{text-decoration:line-through;color:var(--muted)}
.chk{width:22px;height:22px;border-radius:7px;border:2px solid var(--muted);display:grid;place-items:center;transition:.3s var(--ease)}
.done .chk{background:var(--acc);border-color:var(--acc);color:#07110f}
.ic{color:var(--muted);transition:.2s}.ic:hover{color:#fb7185;transform:scale(1.2)}
.empty{color:var(--muted);padding:24px;text-align:center;border:1px dashed var(--line);border-radius:14px}

canvas{max-width:100%;border-radius:16px;background:rgba(0,0,0,.4);border:1px solid var(--line)}
.stat{display:flex;gap:20px;margin-bottom:10px;color:var(--muted)}.stat b{color:var(--text)}
.pad{display:grid;grid-template-columns:repeat(3,52px);gap:6px;margin-top:12px}
.pad button{height:46px;border-radius:12px;background:rgba(255,255,255,.08);transition:.2s}.pad button:active{transform:scale(.9);background:var(--acc);color:#07110f}
.mem{display:grid;grid-template-columns:repeat(4,76px);gap:10px;perspective:700px}
.mc{height:76px;position:relative;transform-style:preserve-3d;transition:transform .5s var(--ease)}
.mc.f{transform:rotateY(180deg)}
.mc>*{position:absolute;inset:0;display:grid;place-items:center;border-radius:16px;backface-visibility:hidden;font-size:30px}
.mc .b{background:var(--panel);border:1px solid var(--line)}.mc:hover .b{border-color:var(--acc)}
.mc .fr{background:color-mix(in srgb,var(--acc) 22%,var(--panel));transform:rotateY(180deg)}
.mc.ok .fr{background:var(--acc);animation:pop .4s}
.ttt{display:grid;grid-template-columns:repeat(3,90px);gap:8px}
.ttt button{height:90px;border-radius:16px;background:rgba(0,0,0,.35);border:1px solid var(--line);font:600 38px "Space Grotesk";transition:.25s var(--ease)}
.ttt button:not(:disabled):hover{background:rgba(255,255,255,.08);transform:scale(1.05)}
.ttt button span{display:inline-block;animation:pop .3s var(--ease)}
.viz{width:100%;height:120px;margin-bottom:16px}
.moods{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px;margin-bottom:16px}
.moods .card.on{border-color:var(--acc);background:color-mix(in srgb,var(--acc) 14%,transparent)}
.chat{display:flex;flex-direction:column;height:calc(100% - 90px);min-height:300px}
.msgs{flex:1;overflow-y:auto;display:flex;flex-direction:column;gap:10px;padding:4px 2px 12px}
.m{max-width:80%;padding:10px 14px;border-radius:16px;background:rgba(0,0,0,.35);animation:pop .35s var(--ease);white-space:pre-wrap;overflow-wrap:anywhere}
.m.me{align-self:flex-end;background:color-mix(in srgb,var(--acc) 25%,transparent)}
.m small{display:block;color:var(--muted);font-size:11px}
.term{background:#050a09;border:1px solid var(--line);border-radius:16px;padding:16px;font:14px/1.5 ui-monospace,Menlo,Consolas,monospace;height:min(480px,60vh);overflow-y:auto;cursor:text}
.term .o{white-space:pre-wrap;overflow-wrap:anywhere}
.term .ln{display:flex;gap:8px}.term .ln span{color:var(--acc)}
.term input{flex:1;background:none;border:0;outline:0;font:inherit;min-width:0}
.swatches{display:flex;gap:12px;flex-wrap:wrap}
.sw{width:100px;padding:12px;border-radius:16px;border:1px solid var(--line);background:rgba(0,0,0,.28);text-align:center;transition:.3s var(--ease)}
.sw:hover{transform:translateY(-4px)}.sw.on{border-color:var(--acc)}
.sw i{display:block;width:100%;height:36px;border-radius:10px;margin-bottom:8px}
.sw small{display:block;color:var(--muted)}
.tog{width:46px;height:26px;border-radius:13px;background:rgba(255,255,255,.15);position:relative;transition:.3s}
.tog:after{content:"";position:absolute;top:3px;left:3px;width:20px;height:20px;border-radius:50%;background:#fff;transition:.3s var(--ease)}
.tog.on{background:var(--acc)}.tog.on:after{transform:translateX(20px)}
.web{display:flex;flex-direction:column;background:#fff}
.wbar{display:flex;gap:12px;align-items:center;padding:8px 14px;background:var(--panel);color:var(--muted);font-size:13px}
.wbar .u{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.wbar a{color:var(--acc);text-decoration:none;white-space:nowrap}
.wbar .n{animation:pop .4s;display:none}.wbar .n.show{display:inline}
.web iframe{flex:1;border:0;width:100%;background:#fff}
.web .ld{height:2px;background:var(--acc);width:0;animation:load 3s var(--ease) forwards}
@keyframes load{to{width:92%}}
.toast{position:fixed;left:50%;bottom:calc(24px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--text);color:#07110f;padding:10px 18px;border-radius:14px;font-weight:500;animation:pop .35s var(--ease);z-index:50}
@media(max-width:700px){
 .app{grid-template-columns:1fr;grid-template-rows:1fr auto}
 .dock{order:2;flex-direction:row;width:100%!important;overflow-x:auto;border-right:0;border-top:1px solid var(--line);padding:6px;box-shadow:none!important}
 .dock .sp{display:none}.dock button span{display:none}.dock button{padding:0 14px;flex:none}
 .main{order:1}
}

.dc{display:grid;grid-template-columns:72px 230px 1fr 210px;height:100%;background:#313338;position:relative;overflow:hidden;font-family:"DM Sans",sans-serif}
.dcsrv{background:#1e1f22;padding:12px;display:flex;flex-direction:column;gap:8px;align-items:center}
.dcsrv button{width:48px;height:48px;border-radius:24px;background:#5865f2;font:700 20px "Space Grotesk";color:#fff;transition:border-radius .25s var(--ease)}
.dcsrv button:hover{border-radius:16px}
.dcch{background:#2b2d31;padding:12px 8px;display:flex;flex-direction:column;gap:2px;min-width:0}
.dcch h4{font:600 16px "Space Grotesk";padding:8px 10px 14px;border-bottom:1px solid #1e1f22;margin-bottom:12px}
.dcch small,.dcmem small{color:#949ba4;font-size:11px;font-weight:600;letter-spacing:.04em;padding:0 10px 6px}
.dcch>button{display:flex;gap:8px;align-items:center;padding:7px 10px;border-radius:6px;color:#949ba4;text-align:left;transition:background .2s,color .2s,padding .25s var(--ease)}
.dcch>button i{font-style:normal;font-size:20px;color:#80848e}
.dcch>button:hover{background:#35373c;color:#dbdee1;padding-left:14px}
.dcch>button.on{background:#404249;color:#fff}
.dcme{margin-top:auto;display:flex;align-items:center;gap:10px;padding:10px;background:#232428;border-radius:8px}
.av{width:36px;height:36px;border-radius:50%;display:grid;place-items:center;font-weight:700;color:#fff;flex:none}
.dcmain{display:flex;flex-direction:column;min-width:0;min-height:0;color:#dbdee1}
.dchead{display:flex;gap:8px;align-items:center;padding:0 16px;height:48px;border-bottom:1px solid #26272b;flex:none}
.dchead i{font-style:normal;color:#80848e;font-size:22px}.dchead span{margin-left:auto;font-size:12px;color:#23a559}
.dcmsgs{flex:1;overflow-y:auto;padding:12px 0}
.dcmsgs.swap{animation:enter .35s var(--ease)}
.dcm{display:flex;gap:14px;padding:6px 16px;animation:pop .3s var(--ease)}
.dcm:hover{background:#2e3035}
.dcm b{font-weight:600}.dcm time{color:#949ba4;font-size:12px;margin-left:8px}
.dcm p{overflow-wrap:anywhere;white-space:pre-wrap;color:#dbdee1}
.dcm.sys{color:#949ba4;font-size:13px;padding-left:66px}
.dcin{padding:0 16px 20px;flex:none}
.dcin input{width:100%;background:#383a40;border:0;border-radius:8px;padding:12px 16px;outline:0;color:#dbdee1}
.dcmem{background:#2b2d31;padding:16px 8px;color:#dbdee1}
.dcm2{display:flex;align-items:center;gap:10px;padding:6px 10px}.dcm2 .av{width:32px;height:32px;font-size:14px}
.dcintro{position:absolute;inset:0;z-index:5;background:radial-gradient(circle at 50% 40%,#2b2d6b,#111214 70%);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:16px;transition:opacity .6s,transform .6s var(--ease);cursor:pointer}
.dcintro.gone{opacity:0;transform:scale(1.08);pointer-events:none}
.dcl{font:700 clamp(40px,9vw,84px)/1 "Space Grotesk";color:#fff;display:flex;text-shadow:0 0 40px #5865f2}
.dcl span{display:inline-block;animation:letter .8s var(--ease) both;animation-delay:var(--d)}
.dcintro p{color:#949ba4;font-size:13px;animation:pop .6s 1.4s both}
@keyframes letter{from{opacity:0;transform:translateY(30px) scale(.6);filter:blur(8px)}}
.auth{min-height:100%;display:grid;place-items:center;position:relative}
.authc{width:min(420px,100%);background:rgba(0,0,0,.35);border:1px solid var(--line);border-radius:22px;padding:28px;backdrop-filter:blur(10px);animation:pop .5s var(--ease)}
.authc label{display:block;color:var(--muted);font-size:13px;margin-bottom:12px}
.authc .in{display:block;width:100%;margin-top:6px;color:var(--text)}
.pw{display:flex;gap:8px;margin-top:6px}.pw .in{margin:0;flex:1}.pw .btn{padding:6px 14px}
.meter{height:5px;border-radius:3px;background:rgba(255,255,255,.1);margin:-4px 0 12px;overflow:hidden}.meter i{display:block;height:100%;width:0;transition:width .35s var(--ease),background .3s}
.err{color:#fb7185;min-height:22px;font-size:14px}.err.shake{animation:shake .4s}
@keyframes shake{20%,60%{transform:translateX(-6px)}40%,80%{transform:translateX(6px)}}
.prof{display:flex;align-items:center;gap:18px}.pavb{position:relative;flex:none;border-radius:50%;width:84px;height:84px;transition:transform .35s var(--ease)}.pavb:hover{transform:scale(1.06)}.pavb:after{content:'Change';position:absolute;inset:0;border-radius:50%;background:rgba(0,0,0,.55);color:#fff;font-size:13px;display:grid;place-items:center;opacity:0;transition:opacity .25s}.pavb:hover:after,.pavb:focus-visible:after{opacity:1}img.pav{object-fit:cover}.pav{width:84px;height:84px;border-radius:50%;background:var(--acc);color:#07110f;display:grid;place-items:center;font:700 30px "Space Grotesk";animation:pop .5s var(--ease)}
@media(max-width:900px){.dc{grid-template-columns:200px 1fr}.dcsrv,.dcmem{display:none}}
@media(max-width:700px){.dc{grid-template-columns:1fr;grid-template-rows:auto 1fr}.dcch{flex-direction:row;overflow-x:auto;padding:6px}.dcch h4,.dcch small,.dcme{display:none}.dcch>button{flex:none}}

.modal{position:fixed;inset:0;z-index:40;background:rgba(0,0,0,.55);backdrop-filter:blur(6px);display:grid;place-items:center;padding:16px;animation:fade .25s}
.modal.out{opacity:0;transition:opacity .22s}
.mbox{width:min(380px,100%);background:var(--panel);border:1px solid var(--line);border-radius:20px;padding:24px;animation:pop .35s var(--ease)}
.mbox h3{font:600 20px "Space Grotesk"}
.mbox label{display:block;color:var(--muted);font-size:13px;margin-bottom:12px}
.mbox .in{display:block;width:100%;margin-top:6px;color:var(--text)}
@keyframes fade{from{opacity:0}}

@property --p{syntax:'<percentage>';inherits:false;initial-value:0%}
.home{padding-top:0}
.sigwrap{position:relative;width:max-content;max-width:100%;margin:0 0 4px}
.sig{font:400 clamp(72px,min(12vw,22vh),170px)/1.1 var(--sf,"Mrs Saint Delafield"),"Brush Script MT",cursive;color:#fff;padding:.25em .45em .2em .4em;margin:0;text-shadow:0 0 28px color-mix(in srgb,var(--acc) 55%,transparent);-webkit-mask-image:linear-gradient(90deg,#000 calc(var(--p) - 10%),transparent var(--p));mask-image:linear-gradient(90deg,#000 calc(var(--p) - 10%),transparent var(--p))}
.sig.done{--p:130%}
.sig.go{animation:sign 3.4s cubic-bezier(.4,.1,.3,1) .35s both}
@keyframes sign{0%{--p:0%}16%{--p:26%}30%{--p:42%}48%{--p:64%}66%{--p:84%}100%{--p:130%}}
.swoosh{display:block;width:70%;margin:-18px 0 0 clamp(24px,5vw,60px);overflow:visible}

.sg{display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:12px}
.si{display:flex;flex-direction:column;gap:6px;padding:14px;border-radius:18px;background:rgba(0,0,0,.35);border:1px solid var(--line);animation:rise .5s var(--ease) both;animation-delay:calc(var(--i)*35ms);transition:transform .3s var(--ease),border-color .3s}
.si:hover{transform:translateY(-4px);border-color:rgba(255,255,255,.25)}

.si .btn{justify-content:center;margin-top:auto;padding:7px 10px}
.pvw{height:72px;display:grid;place-items:center;border-radius:12px;background:rgba(255,255,255,.04);overflow:hidden;margin-bottom:4px}
.nm-glow{text-shadow:0 0 10px var(--acc),0 0 22px var(--acc)}
.nm-grad,.nm-gold,.nm-rainbow{-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent;color:transparent}
.nm-grad{background-image:linear-gradient(90deg,var(--acc),#f0abfc,#fbbf24)}
.nm-gold{background-image:linear-gradient(90deg,#fde68a,#f59e0b,#fde68a)}
.nm-rainbow{background-image:linear-gradient(90deg,#f87171,#fbbf24,#a3e635,#38bdf8,#a78bfa,#f87171);background-size:200% 100%;animation:rb 4s linear infinite}
@keyframes rb{to{background-position:200% 0}}@keyframes spin{to{transform:rotate(360deg)}}@keyframes npulse{50%{box-shadow:0 0 0 3px var(--acc),0 0 30px var(--acc)}}
.pavb{isolation:isolate}.pavb.sm:after{display:none}
.pavb.fr-gold{box-shadow:0 0 0 3px #fbbf24,0 0 18px rgba(251,191,36,.5)}
.pavb.fr-neon{box-shadow:0 0 0 3px var(--acc),0 0 14px var(--acc);animation:npulse 2s ease-in-out infinite}
.pavb.fr-rainbow:before,.pavb.fr-orbit:before{content:"";position:absolute;border-radius:50%;z-index:-1;animation:spin 3.5s linear infinite}
.pavb.fr-rainbow:before{inset:-5px;background:conic-gradient(#f87171,#fbbf24,#a3e635,#38bdf8,#a78bfa,#f87171)}
.pavb.fr-orbit:before{inset:-8px;border:2px dashed var(--acc);animation-duration:9s}
.rip{position:fixed;width:12px;height:12px;margin:-6px;border-radius:50%;border:2px solid var(--acc);pointer-events:none;z-index:99;animation:rip .65s ease-out forwards}
@keyframes rip{to{transform:scale(9);opacity:0}}
.trl{position:fixed;width:8px;height:8px;margin:-4px;border-radius:50%;background:var(--acc);box-shadow:0 0 10px var(--acc);pointer-events:none;z-index:99;animation:trl .65s ease-out forwards}
@keyframes trl{to{transform:translateY(14px) scale(.2);opacity:0}}

textarea.in{display:block;width:100%;resize:vertical;font:inherit;margin-top:6px;color:var(--text)}

</div>
<script>
const P={home:'<path d="M3 11l9-8 9 8M5 10v10h14V10"/>',games:'<rect x="2" y="7" width="20" height="11" rx="4"/><path d="M7 10v5M4.500 12.500h5M16 11h.01M18 14h.01"/>',music:'<path d="M9 18V5l11-2v13"/><circle cx="6.500" cy="18" r="2.500"/><circle cx="17.500" cy="16" r="2.500"/>',film:'<rect x="3" y="4" width="18" height="16" rx="2"/><path d="M7 4v16M17 4v16M3 9h4M3 15h4M17 9h4M17 15h4"/>',ai:'<path d="M12 3l1.800 5.200L19 10l-5.200 1.800L12 17l-1.800-5.200L5 10l5.200-1.800zM19 16l.8 2.200L22 19l-2.200.8L19 22l-.8-2.200L16 19l2.200-.8z"/>',chat:'<path d="M21 12a8 8 0 0 1-11.800 7L3 21l2-5.500A8 8 0 1 1 21 12z"/>',vm:'<rect x="3" y="4" width="18" height="16" rx="2"/><path d="M7 10l3 2-3 2M13 15h4"/>',link:'<path d="M10 14a4 4 0 0 0 5.700 0l3-3a4 4 0 0 0-5.700-5.700l-1 1M14 10a4 4 0 0 0-5.700 0l-3 3A4 4 0 0 0 11 18.700l1-1"/>',shop:'<path d="M4 9l1.500-5h13L20 9M4 9v11h16V9M4 9c0 2 3 2 4 0 1 2 4 2 4 0 1 2 4 2 4 0 1 2 4 2 4 0"/>',user:'<circle cx="12" cy="8" r="4"/><path d="M4 21c1-4 4-6 8-6s7 2 8 6"/>',gear:'<circle cx="12" cy="12" r="3"/><path d="M12 2v3M12 19v3M2 12h3M19 12h3M5 5l2 2M17 17l2 2M19 5l-2 2M7 17l-2 2"/>',x:'<path d="M6 6l12 12M18 6L6 18"/>',plus:'<path d="M12 5v14M5 12h14"/>',search:'<circle cx="11" cy="11" r="7"/><path d="M20 20l-4-4"/>',check:'<path d="M5 12l5 5 9-10"/>',trash:'<path d="M4 7h16M9 7V4h6v3M6 7l1 13h10l1-13"/>',lock:'<rect x="5" y="11" width="14" height="10" rx="2"/><path d="M8 11V8a4 4 0 0 1 8 0v3"/>',send:'<path d="M4 12l16-8-6 16-3-7z"/>',globe:'<circle cx="12" cy="12" r="9"/><path d="M3 12h18M12 3c3 3 3 15 0 18M12 3c-3 3-3 15 0 18"/>'};
const ic=n=>`<svg class="i" viewBox="0 0 24 24">${P[n]}</svg>`;
const $=(s,r=document)=>r.querySelector(s),$$=(s,r=document)=>[...r.querySelectorAll(s)];
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const AUTH_ENDPOINT='https://lumen-auth.ta5l0good.workers.dev/';/* paste your account server URL here (see auth-worker.js) so one sign-in works on every link */
const aep=()=>AUTH_ENDPOINT||S.authUrl||'';
const AI_ENDPOINT='https://yes.ta5l0good.workers.dev/';/* paste your Claude proxy URL here (see claude-worker.js) so AI works on every site */
const ep=()=>AI_ENDPOINT||S.aiUrl||'';
async function viaEp(h,signal){const res=await fetch(ep(),{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({messages:h}),signal});const j=await res.json().catch(()=>({}));if(!res.ok)throw new Error(j.text||('HTTP '+res.status));return{text:j.text}}
const cap=async n=>{try{return window.claude?await window.claude.use(n):null}catch(e){return null}};

let S={name:'guest',coins:0,acc:'#5eead4',own:['#5eead4'],anim:true,h24:false,watch:[],links:[],hs:{snake:0,mem:0},user:null,gl:null,items:[],eq:{bg:'aurora',font:'dm',sig:'Mrs Saint Delafield',name:'plain',badge:'none',frame:'none',fx:[]},gift:0};
try{Object.assign(S,JSON.parse(localStorage.getItem('lumen')||'{}'))}catch(e){}
let syncT=null;
const save=()=>{try{localStorage.setItem('lumen',JSON.stringify(S))}catch(e){}
  if(S.token&&aep()){clearTimeout(syncT);syncT=setTimeout(()=>{api({action:'update',token:S.token,data:snap()}).catch(e=>{if(e.status===401){S.token=null;S.user=null;S.name='guest';S.pic=null;try{localStorage.setItem('lumen',JSON.stringify(S))}catch(x){}}})},1500)}};
function applyTheme(){document.documentElement.style.setProperty('--acc',S.acc);document.body.classList.toggle('noanim',!S.anim);$('#coins').innerHTML=`${ic('shop').replace('class="i"','class="i" style="width:16px;height:16px"')}<b>${S.coins}</b>`}
const mult=()=>Math.max(1,...BOOSTS.filter(b=>(S.items||[]).includes('boost:'+b[0])).map(b=>b[4]));
async function copyText(t){
  let ok=false;
  try{await navigator.clipboard.writeText(t);ok=true}catch(e){}
  if(!ok){try{const a=document.createElement('textarea');a.value=t;a.setAttribute('readonly','');a.style.cssText='position:fixed;top:0;left:0;opacity:0';document.body.appendChild(a);a.select();a.setSelectionRange(0,t.length);ok=document.execCommand('copy');a.remove()}catch(e){}}
  if(ok)return toast('Copied');
  const o=document.createElement('div');o.className='modal';
  o.innerHTML='<div class="mbox"><h3>Copy this link</h3><p class="sub" style="font-size:14px">Your browser blocked automatic copying. The link is selected, so press Ctrl+C (or Cmd+C on a Mac).</p><input class="in" id="cpi" readonly style="width:100%;color:var(--text)"><div class="row" style="margin:14px 0 0"><button class="btn" id="cpx">Done</button></div></div>';
  document.body.appendChild(o);const i=o.querySelector('#cpi');i.value=t;i.focus();i.select();
  const close=()=>{o.classList.add('out');setTimeout(()=>o.remove(),220)};o.querySelector('#cpx').onclick=close;o.onclick=e=>{if(e.target===o)close()};
}
function earn(n,raw){if(n<=0)return;const g=raw?n:Math.max(n,Math.round(n*mult()));S.coins+=g;save();applyTheme();const c=$('#coins');c.classList.add('pop');setTimeout(()=>c.classList.remove('pop'),300);toast('+'+g+' coins'+(!raw&&g>n?' (boosted)':''))}
const NAME_STYLES=['plain','glow','grad','gold','rainbow'],BADGES=['🌟','🔥','🚀','🌙','🎮','🦄','👑','💎'];
const initial=n=>{const m=[...String(n||'')].find(c=>/[\p{L}\p{N}]/u.test(c));return(m||String(n||'?')[0]||'?').toUpperCase()};
const reservedTag=s=>/[\(\[\{<（［｛【]\s*(dev|developer|admin|administrator|owner|mod|moderator|staff|creator|founder)\s*[\)\]\}>）］｝】]/i.test(String(s).normalize('NFKC').replace(/[\u200B-\u200F\u2060\uFEFF]/g,''));
const badge=b=>{b=b===undefined?(S.eq&&S.eq.badge):b;return BADGES.includes(b)?b+' ':''};
const nameHtml=(n,st,bd)=>{st=st===undefined?(S.eq&&S.eq.name):st;if(!NAME_STYLES.includes(st))st='plain';return `${esc(badge(bd))}<span class="nm nm-${st}">${esc(n)}</span>`};
const fontLinked={};
function loadFont(f){if(f==='dm'||f==='Mrs Saint Delafield'||fontLinked[f])return;fontLinked[f]=1;const l=document.createElement('link');l.rel='stylesheet';l.href='https://fonts.googleapis.com/css2?family='+encodeURIComponent(f).replace(/%20/g,'+')+'&display=swap';document.head.appendChild(l)}
function applyCosmetics(){const e=S.eq||{};const f=e.font==='dm'||!e.font?'DM Sans':e.font,g=e.sig||'Mrs Saint Delafield';loadFont(f);loadFont(g);
  document.documentElement.style.setProperty('--fb','"'+f+'"');document.documentElement.style.setProperty('--sf','"'+g+'"')}
let tc=null;function tick(){try{tc=tc||new(window.AudioContext||window.webkitAudioContext)();const o=tc.createOscillator(),g=tc.createGain(),t=tc.currentTime;o.frequency.value=880;g.gain.setValueAtTime(.04,t);g.gain.exponentialRampToValueAtTime(.0001,t+.06);o.connect(g);g.connect(tc.destination);o.start();o.stop(t+.07)}catch(e){}}
document.addEventListener('pointerdown',e=>{const f=(S.eq&&S.eq.fx)||[];
  if(f.includes('ripple')){const d=document.createElement('div');d.className='rip';d.style.left=e.clientX+'px';d.style.top=e.clientY+'px';document.body.appendChild(d);setTimeout(()=>d.remove(),700)}
  if(f.includes('tick')&&e.target.closest&&e.target.closest('button,.tab,.card'))tick()});
let lastTrail=0;document.addEventListener('pointermove',e=>{if(!((S.eq&&S.eq.fx)||[]).includes('trail'))return;const n=performance.now();if(n-lastTrail<35)return;lastTrail=n;
  const d=document.createElement('div');d.className='trl';d.style.left=e.clientX+'px';d.style.top=e.clientY+'px';document.body.appendChild(d);setTimeout(()=>d.remove(),650)});
function toast(t){const e=document.createElement('div');e.className='toast';e.textContent=t;document.body.appendChild(e);setTimeout(()=>{e.style.transition='opacity .3s';e.style.opacity=0;setTimeout(()=>e.remove(),300)},1600)}

/* ---------- sections registry ---------- */
const SEC={
 games:{n:'Games',i:'games',d:'Opens gn-math.dev for more games.',f:secGames},
 minigames:{n:'Mini games',i:'games',d:'Snake, memory and tic-tac-toe. Earn coins.',f:secGames},
 music:{n:'Music',i:'music',d:'Generative ambient sound you can leave running.',f:secMusic},
 movies:{n:'Movies',i:'film',d:'Your watchlist, plus quick lookup.',f:secMovies},
 ai:{n:'AI',i:'ai',d:'Ask Claude questions right here.',f:secAI},
 chat:{n:'Chat',i:'chat',d:'Talk with anyone who has this page open.',f:secChat},
 vms:{n:'Sandbox',i:'vm',d:'A small command line that runs in the page.',f:secVMs},
 linkgen:{n:'Linkgen',i:'link',d:'Save links as shortcuts on your home page.',f:secLinkgen},
 shop:{n:'Shop',i:'shop',d:'Spend coins on accent colors.',f:secShop},
 account:{n:'Account',i:'user',d:'Your name, stats and progress.',f:secAccount},
 settings:{n:'Settings',i:'gear',d:'Animations, clock and colors.',f:secSettings}};

/* ---------- tabs & navigation ---------- */
let tabs=[{id:1,k:'home',t:'Home'}],cur=1,nid=2;
try{const r=JSON.parse(localStorage.getItem('lumen_tabs')||'null');if(r&&Array.isArray(r.tabs)){const ok=r.tabs.filter(t=>t&&Number.isFinite(t.id)&&(t.k==='home'||(t.k==='sec'&&SEC[t.key])||(t.k==='web'&&/^https?:\/\//.test(t.url||''))));
  if(ok.length){tabs=ok.map(t=>({id:t.id,k:t.k,key:t.key,t:String(t.t||'').slice(0,40),url:t.url,alt:t.alt}));cur=tabs.some(t=>t.id===r.cur)?r.cur:tabs[0].id;nid=Math.max(...tabs.map(t=>t.id))+1}}}catch(e){}
let hist=[cur],hi=0,cleanup=null,fresh=null;
const saveTabs=()=>{try{localStorage.setItem('lumen_tabs',JSON.stringify({tabs:tabs.map(({id,k,key,t,url,alt})=>({id,k,key,t,url,alt})),cur}))}catch(e){}};
function tIcon(t){return t.k==='home'?ic('home'):t.k==='sec'?ic(SEC[t.key].i):ic('globe')}
function renderStrip(){
  $('#strip').innerHTML=tabs.map(t=>`<div class="tab ${t.id===cur?'on':''} ${t.id===fresh?'new':''}" data-id="${t.id}" role="button" tabindex="0">${tIcon(t)}<span class="t">${esc(t.t)}</span><button class="x" data-x="${t.id}" aria-label="Close tab">${ic('x').replace('class="i"','class="i" style="width:14px;height:14px"')}</button></div>`).join('')+`<button class="plus" id="np" aria-label="New tab">${ic('plus')}</button>`;
  fresh=null;$('#dock').querySelectorAll('button[data-s]').forEach(b=>{const t=tabs.find(x=>x.id===cur);b.classList.toggle('on',!!t&&((t.k==='home'&&b.dataset.s==='home')||(t.k==='sec'&&t.key===b.dataset.s)))});
}
function renderDock(){
  const it=[['home','Home','home'],...Object.entries(SEC).filter(([k])=>k!=='settings').map(([k,v])=>[k,v.n,v.i])];
  $('#dock').innerHTML=it.map(([k,n,i])=>`<button data-s="${k}" aria-label="${n}">${ic(i)}<span>${n}</span></button>`).join('')+'<div class="sp"></div>'+`<button data-s="settings" aria-label="Settings">${ic('gear')}<span>Settings</span></button>`;
}
function select(id,push=true){cur=id;if(push){hist=hist.slice(0,hi+1);hist.push(id);hi=hist.length-1}show()}
function addTab(t){t.id=nid++;tabs.push(t);fresh=t.id;select(t.id)}
function openSec(k){
  if(k==='games'){const e=tabs.find(t=>t.k==='web'&&t.url==='https://gn-math.dev/');return e?select(e.id):addTab({k:'web',t:'Games',url:'https://gn-math.dev/'})}if(k==='home'){const h=tabs.find(t=>t.k==='home');return h?select(h.id):addTab({k:'home',t:'Home'})}const e=tabs.find(t=>t.k==='sec'&&t.key===k);e?select(e.id):addTab({k:'sec',key:k,t:SEC[k].n})}
function closeTab(id){
  const el=$(`.tab[data-id="${id}"]`);
  const fin=()=>{const i=tabs.findIndex(t=>t.id===id);if(i<0)return;const t=tabs[i];if(t.node)t.node.remove();tabs.splice(i,1);
    if(!tabs.length)tabs.push({id:nid++,k:'home',t:'Home'});
    hist=hist.filter(x=>x!==id);if(cur===id){cur=tabs[Math.max(0,i-1)].id;hist.push(cur)}hi=Math.min(hi,hist.length-1);show()};
  if(el&&S.anim){el.classList.add('out');setTimeout(fin,260)}else fin();
}
function go(raw){
  const v=raw.trim();if(!v)return;
  if(/^(https?:\/\/)?([a-z0-9-]+\.)+[a-z]{2,}(:\d+)?(\/\S*)?$/i.test(v)){const u=/^https?:/i.test(v)?v:'https://'+v;let h=v;try{h=new URL(u).hostname.replace(/^www\./,'')}catch(e){}addTab({k:'web',t:h,url:u})}
  else addTab({k:'web',t:v.slice(0,24),url:'https://en.m.wikipedia.org/w/index.php?search='+encodeURIComponent(v),alt:'https://duckduckgo.com/?q='+encodeURIComponent(v)});
}
function webNode(t){
  const n=document.createElement('div');n.className='web enter';
  n.innerHTML=`<div class="wbar"><span class="u">${esc(t.url)}</span><span class="n" id="wn">Blank? This site may block embedding.</span>${t.alt?`<a href="${t.alt}" target="_blank" rel="noopener">Search the web ↗</a>`:''}<a href="${esc(t.url)}" target="_blank" rel="noopener">Open in new tab ↗</a></div><div class="ld"></div><iframe src="${esc(t.url)}" sandbox="allow-scripts allow-same-origin allow-forms allow-popups allow-presentation" referrerpolicy="no-referrer" allow="fullscreen" title="${esc(t.t)}"></iframe>`;
  setTimeout(()=>{const w=$('.n',n);if(w)w.classList.add('show')},3500);
  $('iframe',n).onload=()=>{const l=$('.ld',n);if(l)l.style.cssText='animation:none;width:100%;opacity:0;transition:opacity .5s'};
  return n;
}
function show(){
  const t=tabs.find(x=>x.id===cur);renderStrip();
  if(cleanup){try{cleanup()}catch(e){}cleanup=null}
  $$('#webs>*').forEach(n=>n.hidden=true);
  const v=$('#view');
  if(t.k==='web'){v.hidden=true;if(!t.node){t.node=webNode(t);$('#webs').appendChild(t.node)}t.node.hidden=false;t.node.classList.remove('enter');void t.node.offsetWidth;t.node.classList.add('enter')}
  else{v.hidden=false;v.innerHTML='';const el=document.createElement('div');el.className='pane enter';v.appendChild(el);cleanup=(t.k==='home'?home:SEC[t.key].f)(el)||null}
  $('#addr').value=t.k==='web'?t.url:'';document.title=t.t+' – Lumen';saveTabs();
}
document.addEventListener('click',e=>{
  const x=e.target.closest('[data-x]');if(x){e.stopPropagation();return closeTab(+x.dataset.x)}
  if(e.target.closest('#np'))return addTab({k:'home',t:'New tab'});
  const t=e.target.closest('.tab');if(t)return select(+t.dataset.id);
  const s=e.target.closest('[data-s]');if(s)return openSec(s.dataset.s);
  const u=e.target.closest('[data-go]');if(u)return go(u.dataset.go);
});
$('#af').onsubmit=e=>{e.preventDefault();go($('#addr').value)};
$('#back').onclick=()=>{if(hi>0){hi--;cur=hist[hi];show()}};
$('#fwd').onclick=()=>{if(hi<hist.length-1){hi++;cur=hist[hi];show()}};
$('#reload').onclick=()=>{const t=tabs.find(x=>x.id===cur);if(t.k==='web'){const f=$('iframe',t.node);f.src=f.src}else show()};

/* ---------- home ---------- */
let sigPlayed=false;
function home(el){
  const play=!sigPlayed;sigPlayed=true;
  const base=[['YouTube','https://www.youtube.com','https://play-lh.googleusercontent.com/QNmuZQc9I6Zbe3mWnSr0hycnENqGFCI5p3yE29Hkxtf22T0IWS6zTrpxULLyyjWpB7ONAXDsDQXnXcVWokl3eg=w240-h480-rw'],['Wikipedia','https://en.wikipedia.org','https://thumb.wikimedia.org/wikipedia/en/thumb/8/80/Wikipedia-logo-v2.svg/1280px-Wikipedia-logo-v2.svg.png?utm_source=en.wikipedia.org&utm_campaign=index&utm_content=thumbnail'],['Google','https://www.google.com','https://yt3.googleusercontent.com/bAseQlKvNmjdLQrvYWm_q3QDp8C8YKyYI-nYJewgOkPi0JU1_3X9oFgjrEdzkOlXzLGFxFbnsw=s900-c-k-c0x00ffffff-no-rj'],['Spotify','https://open.spotify.com','https://pub-b3439294f3f54d31847ca4a79250add0.r2.dev/images/6012de3b1d0bc928d39d4e85_spotify.png'],['GitHub','https://github.com','https://upload.wikimedia.org/wikipedia/commons/c/c2/GitHub_Invertocat_Logo.svg?utm_source=en.wikipedia.org&utm_campaign=index&utm_content=original'],['Scramjet','https://scramjet.mercurywork.shop/']];

function gSnake(b){

function gTtt(b){
  let bd=Array(9).fill(''),over=false;const L=[[0,1,2],[3,4,5],[6,7,8],[0,3,6],[1,4,7],[2,5,8],[0,4,8],[2,4,6]];

  function ai(){let m=find('O');if(m<0)m=find('X');if(m<0&&!bd[4])m=4;if(m<0){const o=[0,2,6,8,1,3,5,7].filter(i=>!bd[i]);m=o[Math.random()*Math.min(o.length,3)|0]}bd[m]='O'}
